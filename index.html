                        <td class="py-3 px-2 text-center font-bold text-amber-400">${b.hr}</td>
                        <td class="py-3 px-2 text-center font-bold text-white">${b.rbi}</td>
                        <td class="py-3 px-2 text-center text-slate-300">${b.r}</td>
                        <td class="py-3 px-2 text-center text-slate-300">${b.bb}</td>
                        <td class="py-3 px-2 text-center text-slate-400">${b.so}</td>
                        <td class="py-3 px-2 text-center text-teal-400">${b.sb}</td>
                        <td class="py-3 px-2 text-center text-slate-200">${fmtRate(b.obp)}</td>
                        <td class="py-3 px-2 text-center text-slate-200">${fmtRate(b.slg)}</td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    function setStatsTeamFilter(val) {
      ui.statsTeamFilter = val;
      renderWorkspace();
    }

    function setMinPA(val) {
      ui.minPA = Math.max(0, parseInt(val, 10) || 0);
      renderWorkspace();
    }

    function sortBatting(key) {
      if (ui.battingSort.key === key) {
        ui.battingSort.dir = ui.battingSort.dir === 'asc' ? 'desc' : 'asc';
      } else {
        ui.battingSort.key = key;
        ui.battingSort.dir = key === 'so' ? 'asc' : 'desc';
      }
      renderWorkspace();
    }

    // =========================================================================
    // 7. 分頁三：投球數據榜 (ERA / WHIP / IP / NP 總投球數 / SO / W / L)
    // =========================================================================
    function renderPitchingStatsTab() {
      const allStats = computeAllPlayerStats();
      const filtered = allStats.filter(p => {
        if (p.pos !== 'P' && p.pitchingSummary.ipOuts === 0 && p.pitchingSummary.pitches === 0) return false;
        if (ui.statsTeamFilter !== 'ALL' && p.teamId !== ui.statsTeamFilter) return false;
        if (p.pitchingSummary.exactInnings < ui.minIP) return false;
        return true;
      });

      const { key, dir } = ui.pitchingSort;
      filtered.sort((a, b) => {
        const va = a.pitchingSummary[key] || 0;
        const vb = b.pitchingSummary[key] || 0;
        return dir === 'asc' ? va - vb : vb - va;
      });

      const cols = [
        { k: 'era', l: 'ERA 防禦率' },
        { k: 'whip', l: 'WHIP' },
        { k: 'w', l: 'W' },
        { k: 'l', l: 'L' },
        { k: 'sv', l: 'SV' },
        { k: 'ipOuts', l: 'IP 局數' },
        { k: 'pitches', l: 'NP 用球數' },
        { k: 'so', l: 'SO 三振' },
        { k: 'bb', l: 'BB' },
        { k: 'h', l: 'H' },
        { k: 'er', l: 'ER' }
      ];

      return `
        <div class="space-y-4">
          <div class="bg-[#0B132B] border border-slate-800 rounded-2xl p-4 flex flex-wrap items-center justify-between gap-3">
            <div>
              <h2 class="text-base font-black text-white flex items-center gap-2">
                <i class="fa-solid fa-fire-flame-curved text-sky-400"></i> 投球數據排行榜 (正規 ${db.league.inningsPerGame || 9} 局制 ERA 換算)
              </h2>
              <p class="text-xs text-slate-400 mt-0.5">點擊欄位標題可切換排序；點擊投手可檢視 ERA / WHIP 公式並手動微調數據。</p>
            </div>
            <div class="flex flex-wrap items-center gap-2">
              <select onchange="setStatsTeamFilter(this.value)" class="bg-slate-950 border border-slate-700 rounded-xl px-3 py-1.5 text-xs font-bold text-white outline-none">
                <option value="ALL" ${ui.statsTeamFilter === 'ALL' ? 'selected' : ''}>全部球隊</option>
                ${(db.teams || []).map(t => `<option value="${t.id}" ${ui.statsTeamFilter === t.id ? 'selected' : ''}>${t.name}</option>`).join('')}
              </select>
              <button type="button" onclick="exportPitchingCSV()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-sky-400 px-3 py-1.5 rounded-xl text-xs font-bold">
                <i class="fa-solid fa-file-csv mr-1"></i>匯出 CSV
              </button>
            </div>
          </div>

          <div class="bg-[#0B132B] border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="bg-slate-800/80 text-[11px] font-black text-slate-300 border-b border-slate-700">
                    <th class="py-3 pl-4 pr-2">#</th>
                    <th class="py-3 px-2 min-w-[140px]">投手 / 球隊</th>
                    ${cols.map(c => `
                      <th onclick="sortPitching('${c.k}')" class="py-3 px-2 text-center cursor-pointer hover:text-white select-none whitespace-nowrap ${key === c.k ? 'text-sky-400 bg-sky-500/10' : ''}">
                        ${c.l} ${key === c.k ? (dir === 'asc' ? '▲' : '▼') : ''}
                      </th>
                    `).join('')}
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-800/60 text-xs tabular-nums">
                  ${filtered.length === 0 ? `
                    <tr><td colspan="13" class="p-8 text-center text-slate-400">尚無投手數據紀錄</td></tr>
                  ` : filtered.map((p, idx) => {
                    const s = p.pitchingSummary;
                    return `
                      <tr onclick="openPlayerStatDetailModal('${p.playerId}', 'pitch')" class="hover:bg-slate-800/50 transition cursor-pointer">
                        <td class="py-3 pl-4 pr-2 font-black text-slate-400">${idx + 1}</td>
                        <td class="py-3 px-2">
                          <div class="flex items-center gap-2">
                            <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background-color: ${p.teamColor}"></span>
                            <div>
                              <div class="font-black text-white">#${p.number} ${p.displayName}</div>
                              <div class="text-[10px] text-slate-400">${p.teamName} • ${p.pos}</div>
                            </div>
                          </div>
                        </td>
                        <td class="py-3 px-2 text-center font-black text-sky-400">${s.era.toFixed(2)}</td>
                        <td class="py-3 px-2 text-center font-bold text-slate-200">${s.whip.toFixed(2)}</td>
                        <td class="py-3 px-2 text-center font-bold text-emerald-400">${s.w}</td>
                        <td class="py-3 px-2 text-center font-bold text-rose-400">${s.l}</td>
                        <td class="py-3 px-2 text-center font-bold text-amber-400">${s.sv}</td>
                        <td class="py-3 px-2 text-center font-bold text-white">${s.ipDisplay}</td>
                        <td class="py-3 px-2 text-center font-bold text-amber-300">${s.pitches}</td>
                        <td class="py-3 px-2 text-center font-bold text-white">${s.so}</td>
                        <td class="py-3 px-2 text-center text-slate-300">${s.bb}</td>
                        <td class="py-3 px-2 text-center text-slate-300">${s.h}</td>
                        <td class="py-3 px-2 text-center text-slate-300">${s.er}</td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>

    function sortPitching(key) {
      if (ui.pitchingSort.key === key) {
        ui.pitchingSort.dir = ui.pitchingSort.dir === 'asc' ? 'desc' : 'asc';
      } else {
        ui.pitchingSort.key = key;
        ui.pitchingSort.dir = ['era', 'whip', 'l', 'er', 'bb', 'h'].includes(key) ? 'asc' : 'desc';
      }
      renderWorkspace();
    }

    // =========================================================================
    // 7.5 分頁：生涯投打對決分析中心 (Batter vs. Pitcher Career Matchups)
    // =========================================================================
    function renderMatchupsTab() {
      const allBatters = [];
      const allPitchers = [];
      (db.teams || []).forEach(t => {
        (t.players || []).forEach(p => {
          if (ui.matchupBatterTeam === 'ALL' || t.id === ui.matchupBatterTeam) {
            allBatters.push({ player: p, team: t });
          }
          if (p.pos === 'P' && (ui.matchupPitcherTeam === 'ALL' || t.id === ui.matchupPitcherTeam)) {
            allPitchers.push({ player: p, team: t });
          }
        });
      });

      const allMatchups = computeCareerMatchups();
      if (!ui.matchupBatterId || !allBatters.some(x => x.player.id === ui.matchupBatterId)) {
        ui.matchupBatterId = allMatchups[0]?.batterId || allBatters[0]?.player.id || '';
      }
      if (!ui.matchupPitcherId || !allPitchers.some(x => x.player.id === ui.matchupPitcherId)) {
        ui.matchupPitcherId = allMatchups[0]?.pitcherId || allPitchers[0]?.player.id || '';
      }

      const selectedMatchup = (ui.matchupBatterId && ui.matchupPitcherId)
        ? getSingleMatchupStats(ui.matchupBatterId, ui.matchupPitcherId)
        : null;

      // 篩選與排序全聯盟對決榜
      const q = (ui.matchupSearch || '').trim().toLowerCase();
      const rankedMatchups = allMatchups.filter(m => {
        if (m.pa === 0 && m.history.length === 0) return false;
        if (!q) return true;
        const text = `${m.batter.name} ${formatPlayerName(m.batter, 'short')} ${m.pitcher.name} ${formatPlayerName(m.pitcher, 'short')} ${m.batterTeam.name} ${m.pitcherTeam.name}`.toLowerCase();
        return text.includes(q);
      });

      const { key: mKey, dir: mDir } = ui.matchupSort;
      rankedMatchups.sort((a, b) => {
        const va = a[mKey] || 0;
        const vb = b[mKey] || 0;
        return mDir === 'asc' ? va - vb : vb - va;
      });

      const mCols = [
        { k: 'pa', l: 'PA 打席' },
        { k: 'ab', l: 'AB' },
        { k: 'h', l: 'H' },
        { k: 'hr', l: 'HR' },
        { k: 'rbi', l: 'RBI' },
        { k: 'bb', l: 'BB' },
        { k: 'so', l: 'SO' },
        { k: 'avg', l: 'AVG 對戰打擊率' },
        { k: 'obp', l: 'OBP' },
        { k: 'slg', l: 'SLG' },
        { k: 'ops', l: 'OPS' }
      ];

      return `
        <div class="space-y-5">
          <!-- 頂部標題與匯出列 -->
          <div class="bg-[#0B132B] border border-slate-800 rounded-2xl p-4 flex flex-wrap items-center justify-between gap-3">
            <div>
              <h2 class="text-base font-black text-white flex items-center gap-2">
                <i class="fa-solid fa-swords text-orange-400"></i> 生涯投打對決數據分析中心 (Batter vs. Pitcher)
              </h2>
              <p class="text-xs text-slate-400 mt-0.5">自動彙整所有比賽投打交手紀錄，支援任意球員對比、打擊分布視覺化與手動補登歷史基準值。</p>
            </div>
            <button type="button" onclick="exportMatchupsCSV()" class="bg-slate-800 hover:bg-slate-700 border border-orange-500/40 text-orange-300 px-3.5 py-2 rounded-xl text-xs font-black transition flex items-center gap-1.5">
              <i class="fa-solid fa-file-csv"></i> 匯出對決數據 CSV
            </button>
          </div>

          <!-- 互動式投打對決查詢器卡片 -->
          <div class="bg-[#0B132B] border border-slate-800 rounded-2xl p-4 sm:p-5 space-y-4 shadow-xl">
            <div class="grid grid-cols-1 md:grid-cols-11 gap-3 items-end">
              <!-- 打者選擇 -->
              <div class="md:col-span-5 bg-slate-950 border border-slate-800 rounded-2xl p-3.5 space-y-2">
                <div class="flex items-center justify-between">
                  <span class="text-xs font-black text-amber-400"><i class="fa-solid fa-baseball-bat-ball mr-1"></i>選擇打者 (Batter)</span>
                  <select onchange="setMatchupFilter('matchupBatterTeam', this.value)" class="bg-slate-900 border border-slate-700 rounded-lg px-2 py-0.5 text-[11px] text-slate-300 outline-none">
                    <option value="ALL" ${ui.matchupBatterTeam === 'ALL' ? 'selected' : ''}>全部球隊</option>
                    ${(db.teams || []).map(t => `<option value="${t.id}" ${ui.matchupBatterTeam === t.id ? 'selected' : ''}>${t.name}</option>`).join('')}
                  </select>
                </div>
                <select onchange="setMatchupPlayer('matchupBatterId', this.value)" class="w-full bg-slate-900 border border-slate-700 focus:border-amber-400 rounded-xl px-3 py-2 text-xs font-black text-white outline-none">
                  ${allBatters.length === 0 ? `<option value="">-- 尚無可選打者 --</option>` : allBatters.map(x => `
                    <option value="${x.player.id}" ${ui.matchupBatterId === x.player.id ? 'selected' : ''}>
                      #${x.player.number} ${formatPlayerName(x.player, 'full')} (${x.player.pos} • ${x.team.code})
                    </option>
                  `).join('')}
                </select>
              </div>

              <!-- VS 徽章 -->
              <div class="md:col-span-1 flex items-center justify-center py-1">
                <div class="w-10 h-10 rounded-full bg-gradient-to-br from-orange-500 to-amber-500 text-slate-950 font-black text-xs flex items-center justify-center shadow-lg shadow-orange-500/25">
                  VS
                </div>
              </div>

              <!-- 投手選擇 (僅限 P) -->
              <div class="md:col-span-5 bg-slate-950 border border-slate-800 rounded-2xl p-3.5 space-y-2">
                <div class="flex items-center justify-between">
                  <span class="text-xs font-black text-sky-400"><i class="fa-solid fa-fire-flame-curved mr-1"></i>選擇投手 (僅限 P)</span>
                  <select onchange="setMatchupFilter('matchupPitcherTeam', this.value)" class="bg-slate-900 border border-slate-700 rounded-lg px-2 py-0.5 text-[11px] text-slate-300 outline-none">
                    <option value="ALL" ${ui.matchupPitcherTeam === 'ALL' ? 'selected' : ''}>全部球隊</option>
                    ${(db.teams || []).map(t => `<option value="${t.id}" ${ui.matchupPitcherTeam === t.id ? 'selected' : ''}>${t.name}</option>`).join('')}
                  </select>
                </div>
                <select onchange="setMatchupPlayer('matchupPitcherId', this.value)" class="w-full bg-slate-900 border border-slate-700 focus:border-sky-400 rounded-xl px-3 py-2 text-xs font-black text-white outline-none">
                  ${allPitchers.length === 0 ? `<option value="">-- 尚無登錄投手 (P) --</option>` : allPitchers.map(x => `
                    <option value="${x.player.id}" ${ui.matchupPitcherId === x.player.id ? 'selected' : ''}>
                      #${x.player.number} ${formatPlayerName(x.player, 'full')} (P • ${x.team.code})
                    </option>
                  `).join('')}
                </select>
              </div>
            </div>

            ${selectedMatchup ? renderSelectedMatchupDetail(selectedMatchup) : `
              <div class="bg-slate-950 border border-slate-800 rounded-2xl p-8 text-center text-xs text-slate-400">
                請選擇打者與投手以檢視生涯對決分析。
              </div>
            `}
          </div>

          <!-- 全聯盟熱門投打對決排行榜 -->
          <div class="bg-[#0B132B] border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
            <div class="p-4 bg-slate-800/70 border-b border-slate-800 flex flex-wrap items-center justify-between gap-2">
              <div>
                <h3 class="text-sm font-black text-white flex items-center gap-2">
                  <i class="fa-solid fa-ranking-star text-amber-400"></i> 全聯盟投打對決總覽榜 (${rankedMatchups.length} 組對戰組合)
                </h3>
                <p class="text-[11px] text-slate-400">點選任一對戰列可立即載入上方詳細對比卡片</p>
              </div>
              <div class="relative w-full sm:w-64">
                <i class="fa-solid fa-magnifying-glass text-slate-500 text-xs absolute left-3 top-1/2 -translate-y-1/2"></i>
                <input type="text" value="${ui.matchupSearch || ''}" oninput="setMatchupSearch(this.value)" placeholder="搜尋打者、投手或球隊..." class="w-full bg-slate-950 border border-slate-700 focus:border-orange-400 rounded-xl pl-8 pr-3 py-1.5 text-xs text-white outline-none">
              </div>
            </div>

            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="bg-slate-950/70 text-[11px] font-black text-slate-300 border-b border-slate-800">
                    <th class="py-3 pl-4 pr-2">#</th>
                    <th class="py-3 px-2 min-w-[140px]">打者 (Batter)</th>
                    <th class="py-3 px-2 min-w-[140px]">投手 (Pitcher)</th>
                    <th class="py-3 px-2 text-center">優勢評估</th>
                    ${mCols.map(c => `
                      <th onclick="sortMatchups('${c.k}')" class="py-3 px-2 text-center cursor-pointer hover:text-white select-none whitespace-nowrap ${mKey === c.k ? 'text-orange-400 bg-orange-500/10' : ''}">
                        ${c.l} ${mKey === c.k ? (mDir === 'asc' ? '▲' : '▼') : ''}
                      </th>
                    `).join('')}
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-800/60 text-xs tabular-nums">
                  ${rankedMatchups.length === 0 ? `
                    <tr><td colspan="15" class="p-8 text-center text-slate-400">尚無投打對決紀錄，請先在「賽程與紀錄台」記錄打席或手動補登對決基準值。</td></tr>
                  ` : rankedMatchups.map((m, idx) => {
                    let edgeBadge = `<span class="px-2 py-0.5 rounded bg-slate-800 text-slate-400 text-[10px] font-bold">樣本累積中</span>`;
                    if (m.ab >= 2) {
                      if (m.avg >= 0.350 || m.ops >= 0.950) {
                        edgeBadge = `<span class="px-2 py-0.5 rounded bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 text-[10px] font-black">🔥 打者天敵</span>`;
                      } else if (m.avg <= 0.167 && m.ops <= 0.450) {
                        edgeBadge = `<span class="px-2 py-0.5 rounded bg-sky-500/20 border border-sky-500/40 text-sky-300 text-[10px] font-black">🛡️ 完全壓制</span>`;
                      } else {
                        edgeBadge = `<span class="px-2 py-0.5 rounded bg-amber-500/15 text-amber-300 text-[10px] font-bold">勢均力敵</span>`;
                      }
                    }

                    return `
                      <tr onclick="jumpToMatchupAnalyzer('${m.batterId}', '${m.pitcherId}')" class="hover:bg-slate-800/50 transition cursor-pointer ${m.batterId === ui.matchupBatterId && m.pitcherId === ui.matchupPitcherId ? 'bg-orange-500/10' : ''}">
                        <td class="py-3 pl-4 pr-2 font-black text-slate-400">${idx + 1}</td>
                        <td class="py-3 px-2">
                          <div class="font-black text-white">#${m.batter.number} ${formatPlayerName(m.batter)}</div>
                          <div class="text-[10px] text-slate-400">${m.batterTeam.name} • ${m.batter.pos}</div>
                        </td>
                        <td class="py-3 px-2">
                          <div class="font-black text-sky-300">#${m.pitcher.number} ${formatPlayerName(m.pitcher)}</div>
                          <div class="text-[10px] text-slate-400">${m.pitcherTeam.name} • P</div>
                        </td>
                        <td class="py-3 px-2 text-center whitespace-nowrap">${edgeBadge}</td>
                        <td class="py-3 px-2 text-center font-black text-white">${m.pa}</td>
                        <td class="py-3 px-2 text-center text-slate-300">${m.ab}</td>
                        <td class="py-3 px-2 text-center font-bold text-emerald-400">${m.h}</td>
                        <td class="py-3 px-2 text-center font-bold text-amber-400">${m.hr}</td>
                        <td class="py-3 px-2 text-center font-bold text-white">${m.rbi}</td>
                        <td class="py-3 px-2 text-center text-sky-300">${m.bb}</td>
                        <td class="py-3 px-2 text-center text-rose-300">${m.so}</td>
                        <td class="py-3 px-2 text-center font-black text-orange-300">${fmtRate(m.avg)}</td>
                        <td class="py-3 px-2 text-center text-slate-200">${fmtRate(m.obp)}</td>
                        <td class="py-3 px-2 text-center text-slate-200">${fmtRate(m.slg)}</td>
                        <td class="py-3 px-2 text-center font-black text-amber-300">${fmtRate(m.ops)}</td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    function renderSelectedMatchupDetail(m) {
      const totalOutcomes = Math.max(1, m.pa);
      const hitPct = Math.round((m.h / totalOutcomes) * 100);
      const walkPct = Math.round(((m.bb + m.hbp) / totalOutcomes) * 100);
      const soPct = Math.round((m.so / totalOutcomes) * 100);
      const otherOutPct = Math.max(0, 100 - hitPct - walkPct - soPct);

      return `
        <div class="bg-slate-950 border border-orange-500/30 rounded-2xl p-4 space-y-4">
          <!-- 雙方名牌與手動補登按鈕 -->
          <div class="flex flex-wrap items-center justify-between gap-3 pb-3 border-b border-slate-800">
            <div class="flex items-center gap-3">
              ${renderTeamLogo(m.batterTeam, 'md')}
              <div>
                <div class="text-sm font-black text-white">#${m.batter.number} ${formatPlayerName(m.batter, 'full')} <span class="text-xs text-amber-400">(${m.batter.pos} • ${m.batter.bt})</span></div>
                <div class="text-[11px] text-slate-400">${m.batterTeam.name} • 打者視角</div>
              </div>
              <span class="px-2.5 py-1 rounded-lg bg-orange-500/20 text-orange-300 font-black text-xs mx-1">VS</span>
              ${renderTeamLogo(m.pitcherTeam, 'md')}
              <div>
                <div class="text-sm font-black text-sky-300">#${m.pitcher.number} ${formatPlayerName(m.pitcher, 'full')} <span class="text-xs text-slate-400">(P • ${m.pitcher.bt})</span></div>
                <div class="text-[11px] text-slate-400">${m.pitcherTeam.name} • 投手視角</div>

    // =========================================================================
    // 8. 分頁四：聯盟戰績表 + 球隊與英文名字隨機生成名單管理
    // =========================================================================
    function computeStandings() {
      const map = {};
      (db.teams || []).forEach(t => {
        map[t.id] = { team: t, w: 0, l: 0, t: 0, rs: 0, ra: 0 };
      });

      (db.games || []).filter(g => g.status === 'FINAL').forEach(g => {
        const aRuns = calcGameRuns(g, 'away');
        const hRuns = calcGameRuns(g, 'home');
        if (map[g.awayTeamId]) {
          map[g.awayTeamId].rs += aRuns;
          map[g.awayTeamId].ra += hRuns;
          if (aRuns > hRuns) map[g.awayTeamId].w++;
          else if (aRuns < hRuns) map[g.awayTeamId].l++;
          else map[g.awayTeamId].t++;
        }
        if (map[g.homeTeamId]) {
          map[g.homeTeamId].rs += hRuns;
          map[g.homeTeamId].ra += aRuns;
          if (hRuns > aRuns) map[g.homeTeamId].w++;
          else if (hRuns < aRuns) map[g.homeTeamId].l++;
          else map[g.homeTeamId].t++;
        }
      });

      const list = Object.values(map).map(row => {
        const gCount = row.w + row.l + row.t;
        const pct = (row.w + row.l) > 0 ? row.w / (row.w + row.l) : 0;
        const diff = row.rs - row.ra;
        return { ...row, gCount, pct, diff };
      });

      list.sort((a, b) => (b.pct - a.pct) || (b.w - a.w) || (b.diff - a.diff));
      const top = list[0];
      return list.map((row, idx) => {
        const gb = idx === 0 || !top ? '-' : (((top.w - row.w) + (row.l - top.l)) / 2).toFixed(1);
        return { ...row, rank: idx + 1, gb };
      });
    }

    function rollInlineRandomPlayer(teamId) {
      const team = getTeamById(teamId);
      const style = document.getElementById('inline-rnd-style')?.value || 'japanese';
      const generated = generateRandomProName(style);

      const usedNums = new Set((team.players || []).map(p => String(p.number)));
      let num = Math.floor(Math.random() * 98) + 1;
      let guard = 0;
      while (usedNums.has(String(num)) && guard < 100) {
        num = Math.floor(Math.random() * 98) + 1;
        guard++;
      }

      const positions = ['P', 'C', '1B', '2B', '3B', 'SS', 'LF', 'CF', 'RF', 'DH'];
      const randPos = positions[Math.floor(Math.random() * positions.length)];

      document.getElementById('inline-p-num').value = String(num);
      document.getElementById('inline-p-first').value = generated.firstName;
      document.getElementById('inline-p-last').value = generated.lastName;
      document.getElementById('inline-p-pos').value = randPos;
    }

    function submitInlineQuickPlayer(teamId) {
      const team = getTeamById(teamId);
      const num = document.getElementById('inline-p-num').value.trim() || String(Math.floor(Math.random() * 98) + 1);
      const firstName = document.getElementById('inline-p-first').value.trim();
      const lastName = document.getElementById('inline-p-last').value.trim();
      const pos = document.getElementById('inline-p-pos').value;

      if (!firstName && !lastName) {
        showToast('請先輸入球員名字，或點擊「🎲 隨機骰一個英文名字」');
        return;
      }

      const fullName = firstName && lastName ? `${firstName} ${lastName}` : (firstName || lastName);
      team.players.push({
        id: 'p_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
        number: num,
        firstName: firstName && lastName ? firstName : '',
        lastName: firstName && lastName ? lastName : fullName,
        name: fullName,
        pos,
        bt: 'R/R',
        manualBat: emptyBat(),
        manualPitch: emptyPitch()
      });

      saveDB(`已加入 #${num} ${fullName} (${pos})`);
      renderWorkspace();
    }

      const team = getTeamById(teamId);

      team.players = [...(team.players || []), ...generated];
      saveDB(`已為「${team.name}」一鍵生成 ${count} 名球員 (含多位 P 投手)！`);

      const mode = document.getElementById('bg-mode').value;

      const existingNums = mode === 'append' ? new Set((team.players || []).map(p => String(p.number))) : new Set();
      const generated = generateRosterArray(count, style, existingNums);
      team.players = mode === 'append' ? [...(team.players || []), ...generated] : generated;

      closeModal();
      saveDB(`已為「${team.name}」生成 ${count} 名球員！`);
      renderWorkspace();
    }

    function saveTeamForm(e, teamId) {
      e.preventDefault();
      const name = document.getElementById('tm-name').value.trim();

      const color = document.getElementById('tm-color').value;

      if (teamId) {
        const t = getTeamById(teamId);
        t.name = name;
        t.code = code;
        t.color = color;
        saveDB('球隊資料已更新');
      } else {
        const newTeam = { id: 'team_' + Date.now(), name, code, color, players: [] };
        db.teams.push(newTeam);
        ui.selectedTeamIdForRoster = newTeam.id;
        saveDB(`已建立新球隊「${name}」`);

      closeModal();
      renderWorkspace();

    function deleteTeam(teamId) {
      db.teams = db.teams.filter(t => t.id !== teamId);
      if (ui.selectedTeamIdForRoster === teamId) {
        ui.selectedTeamIdForRoster = db.teams[0]?.id || null;
      }
      saveDB('已刪除該球隊');
      renderWorkspace();
    }

          p.number = num;
          p.firstName = first;
          p.lastName = last;
          p.name = fullName;
          p.pos = pos;
          p.bt = bt;

        saveDB('球員資料已更新');

          id: 'p_' + Date.now() + '_' + Math.floor(Math.random() * 1000),

    // =========================================================================
    // 9. 多存檔槽儲存管理與 Excel CSV / JSON 匯出中心
    // =========================================================================
    function openDataManagerModal() {

      openModal('💾 多存檔槽儲存管理與報表匯出中心', `

              <button type="submit" class="bg-amber-500 hover:bg-amber-400 active:scale-95 text-slate-950 text-xs font-black px-4 py-2 rounded-xl transition flex items-center justify-center gap-1.5 shrink-0">

            ${slots.length === 0 ? `

                目前尚無已建立的獨立存檔槽。在上方輸入名稱並點擊「另存為新存檔槽」，即可保存多個不同聯盟！
              </div>
            ` : `
              <div class="space-y-2 max-h-[230px] overflow-y-auto pr-0.5">
                ${slots.map(slot => `
                  <div class="bg-slate-950 border border-slate-800 hover:border-slate-700 rounded-xl p-3 flex flex-col sm:flex-row sm:items-center justify-between gap-2.5">
                    <div class="min-w-0">
                      <div class="text-xs font-black text-white truncate flex items-center gap-1.5">

                      <div class="text-[11px] text-slate-400 mt-0.5 truncate">

                      </div>
                      <div class="text-[10px] text-slate-500 mt-0.5">最後儲存：${slot.updatedAt}</div>

                    <div class="flex items-center gap-1.5 shrink-0">

                      <button type="button" onclick="overwriteSaveSlot('${slot.id}')" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-emerald-300 border border-slate-700 text-[11px] font-bold transition">

          <div class="pt-3 border-t border-slate-800 space-y-2">

            </h4>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
              <button type="button" onclick="exportJSON()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 p-3 rounded-xl text-left flex items-start gap-2.5 transition">
                <i class="fa-solid fa-download text-amber-400 text-base mt-0.5"></i>

                  <div class="text-xs font-black text-white">📥 匯出完整 JSON 存檔</div>

                </div>
              </button>
              <button type="button" onclick="document.getElementById('json-import-input').click()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 p-3 rounded-xl text-left flex items-start gap-2.5 transition">
                <i class="fa-solid fa-upload text-purple-400 text-base mt-0.5"></i>
                <div>
                  <div class="text-xs font-black text-white">📤 匯入 JSON 還原</div>
                  <div class="text-[10px] text-slate-400 mt-0.5">載入備份檔並立即寫入自動儲存</div>
                </div>
              </button>
              <button type="button" onclick="exportBattingCSV()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 p-3 rounded-xl text-left flex items-start gap-2.5 transition">
                <i class="fa-solid fa-file-csv text-emerald-400 text-base mt-0.5"></i>

              </button>
              <button type="button" onclick="exportPitchingCSV()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 p-3 rounded-xl text-left flex items-start gap-2.5 transition">

                <div>
                  <div class="text-xs font-black text-white">📊 匯出投球數據 Excel (.CSV)</div>
                  <div class="text-[10px] text-slate-400 mt-0.5">含 ERA / WHIP / NP 用球數 / K9</div>

              </button>
              <button type="button" onclick="exportMatchupsCSV()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 p-3 rounded-xl text-left flex items-start gap-2.5 transition sm:col-span-2">
                <i class="fa-solid fa-swords text-orange-400 text-base mt-0.5"></i>
                <div>
                  <div class="text-xs font-black text-white">⚔️ 匯出生涯投打對決統計 Excel (.CSV)</div>
                  <div class="text-[10px] text-slate-400 mt-0.5">含所有投打交手 PA / AB / H / HR / RBI / BB / SO / AVG / OPS</div>

          </div>

          <div class="pt-3 border-t border-slate-800 flex flex-wrap gap-2 justify-between">
            <button type="button" onclick="restoreSampleLeague()" class="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-300">
              載入演示範例聯盟
            </button>
            <button type="button" onclick="clearToBlankLeague(); closeModal();" class="px-3.5 py-2 rounded-xl bg-rose-950/70 hover:bg-rose-900 text-xs font-bold text-rose-300 border border-rose-800/60">
              清空目前畫面 (建立全新空白聯盟)
            </button>
          </div>
        </div>
      `);
    }

    function downloadCSVFile(filename, rows) {
      const csvContent = '\uFEFF' + rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
      showToast(`已匯出 ${filename}`);
    }

    function exportBattingCSV() {
      const stats = computeAllPlayerStats();
      const rows = [
        ['背號', '球員姓名', '所屬球隊', '位置', 'G', 'PA', 'AB', 'R', 'H', '2B', '3B', 'HR', 'TB', 'RBI', 'BB', 'HBP', 'SO', 'SF', 'SB', 'AVG', 'OBP', 'SLG', 'OPS']
      ];
      stats.forEach(p => {
        const b = p.battingSummary;
        rows.push([
          p.number, p.name, p.teamName, p.pos,
          b.g, b.pa, b.ab, b.r, b.h, b.b2, b.b3, b.hr, b.tb, b.rbi, b.bb, b.hbp, b.so, b.sf, b.sb,
          fmtRate(b.avg), fmtRate(b.obp), fmtRate(b.slg), fmtRate(b.ops)
        ]);
      });
      downloadCSVFile(`${db.league.name}_打擊數據統計.csv`, rows);
    }

    function exportPitchingCSV() {
      const stats = computeAllPlayerStats();
      const rows = [
        ['背號', '投手姓名', '所屬球隊', 'G', 'W', 'L', 'SV', 'IP', 'NP', 'H', 'HR', 'R', 'ER', 'BB', 'SO', 'ERA', 'WHIP', 'K/9', 'BAA']
      ];
      stats.filter(p => p.pitchingSummary.ipOuts > 0 || p.pitchingSummary.pitches > 0 || p.pos === 'P').forEach(p => {
        const s = p.pitchingSummary;
        rows.push([
          p.number, p.name, p.teamName,
          s.g, s.w, s.l, s.sv, s.ipDisplay, s.pitches, s.h, s.hr, s.r, s.er, s.bb, s.so,
          s.era.toFixed(2), s.whip.toFixed(2), s.k9.toFixed(2), fmtRate(s.baa)
        ]);
      });
      downloadCSVFile(`${db.league.name}_投球數據統計.csv`, rows);
    }

    function exportJSON() {
      const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${db.league.name}_系統備份_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('已下載 JSON 備份檔案');
    }

    function handleImportJSON(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          const parsed = JSON.parse(ev.target.result);
          if (parsed && parsed.league && Array.isArray(parsed.teams)) {
            db = parsed;
            if (!Array.isArray(db.games)) db.games = [];
            if (!db.manualMatchups || typeof db.manualMatchups !== 'object') db.manualMatchups = {};
            db.games.forEach(g => ensureGameLineupsAndPitcher(g, db));
            ui.selectedGameId = db.games[0]?.id || null;
            ui.selectedTeamIdForRoster = db.teams[0]?.id || null;
            saveDB('備份資料還原成功！');
            closeModal();
            renderWorkspace();
          } else {
            showToast('檔案格式不正確');
          }
        } catch (err) {
          showToast('JSON 檔案解析失敗');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    }

    function restoreSampleLeague() {
      db = createSampleLeagueData();
      ui.selectedGameId = db.games[0]?.id || null;
      ui.selectedTeamIdForRoster = db.teams[0]?.id || null;
      saveDB('已載入演示範例聯盟');
      closeModal();
      renderWorkspace();
    }

    // =========================================================================
    // 10. Modal 開關與啟動初始化
    // =========================================================================
    function openModal(title, html) {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-body').innerHTML = html;
      document.getElementById('modal-overlay').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal-overlay').classList.add('hidden');
    }

    document.getElementById('modal-overlay').addEventListener('click', e => {
      if (e.target === e.currentTarget) closeModal();
    });

    window.onload = function() {
      updateHeaderDisplay();
      updateSaveStatusIndicator();
      switchTab('games');
    };
  </script>
