  <!-- Toast 提示訊息 -->

  <!-- 隱藏檔案輸入框 (JSON 匯入) -->
  <input type="file" id="json-import-input" accept=".json" class="hidden" onchange="handleImportJSON(event)">

  <script>
    // =========================================================================
    // 0. 全局錯誤防護與基礎資料結構定義
    // =========================================================================
    window.addEventListener('error', function(e) {
      console.error('系統捕捉到異常:', e.message);
    });

    const STORAGE_KEY = 'BASEBALL_CUSTOM_STAT_ENGINE_V3';
    const SAVE_SLOTS_KEY = 'BASEBALL_CUSTOM_STAT_SAVE_SLOTS_V3';

    function emptyBat() {
      return { g: 0, ab: 0, r: 0, h: 0, d2: 0, d3: 0, hr: 0, rbi: 0, bb: 0, ibb: 0, hbp: 0, so: 0, sf: 0, sh: 0, sb: 0, cs: 0 };
    }

    function emptyPitch() {
      return { g: 0, w: 0, l: 0, sv: 0, hld: 0, ipOuts: 0, pitches: 0, h: 0, r: 0, er: 0, hr: 0, bb: 0, hbp: 0, so: 0 };
    }

    function emptyMatchup() {
      return { ab: 0, h: 0, d2: 0, d3: 0, hr: 0, rbi: 0, bb: 0, hbp: 0, so: 0, sf: 0 };
    }

    // 多國職棒風格英文姓名資料庫 (日本羅馬拼音英文 / 美式 / 拉丁美洲)
    const PRO_NAME_POOLS = {
      japanese: {
        first: ['Shohei', 'Yoshinobu', 'Roki', 'Munetaka', 'Seiya', 'Shota', 'Kazuma', 'Yu', 'Kodai', 'Yusei', 'Masataka', 'Kensuke', 'Teruaki', 'Shugo', 'Kaito', 'Haruki', 'Ryo', 'Taisei', 'Sora', 'Ren', 'Yuto', 'Hiroto', 'Koki', 'Takumi', 'Chusei', 'Kaima', 'Soshi', 'Hayato'],
        last: ['Ohtani', 'Yamamoto', 'Sasaki', 'Murakami', 'Suzuki', 'Imanaga', 'Okamoto', 'Darvish', 'Senga', 'Kikuchi', 'Yoshida', 'Kondoh', 'Sato', 'Maki', 'Takahashi', 'Tanaka', 'Yamada', 'Sakamoto', 'Nakai', 'Matsui', 'Maeda', 'Fujinami', 'Mannami', 'Taira', 'Genda', 'Kuriyama']
      },
      american: {
        first: ['Bryce', 'Aaron', 'Mookie', 'Gerrit', 'Bobby', 'Corey', 'Trea', 'Freddie', 'Paul', 'Nolan', 'Tarik', 'Zack', 'Logan', 'Corbin', 'Gunnar', 'Adley', 'Riley', 'Kyle', 'Will', 'Matt', 'Austin', 'Max', 'Cole', 'Dylan'],
        last: ['Harper', 'Judge', 'Betts', 'Cole', 'Witt Jr.', 'Seager', 'Turner', 'Freeman', 'Goldschmidt', 'Arenado', 'Skubal', 'Wheeler', 'Webb', 'Carroll', 'Henderson', 'Rutschman', 'Greene', 'Tucker', 'Smith', 'Olson', 'Riley', 'Fried', 'Ragans', 'Cease']
      },
      latin: {
        first: ['Juan', 'Ronald', 'Julio', 'Fernando', 'Vladimir', 'Jose', 'Rafael', 'Yordan', 'Ketel', 'Elly', 'Francisco', 'Manny', 'Luis', 'Ozzie', 'Willy', 'Teoscar', 'Randy', 'Sandy', 'Framber', 'Emmanuel', 'Camilo', 'Felix', 'Marcell', 'Carlos'],
        last: ['Soto', 'Acuna Jr.', 'Rodriguez', 'Tatis Jr.', 'Guerrero Jr.', 'Ramirez', 'Devers', 'Alvarez', 'Marte', 'De La Cruz', 'Lindor', 'Machado', 'Arraez', 'Albies', 'Adames', 'Hernandez', 'Arozarena', 'Alcantara', 'Valdez', 'Clase', 'Doval', 'Bautista', 'Ozuna', 'Correa']
      }
    };

    function generateRandomProName(style = 'japanese') {
      let chosenPoolKey = style;
      if (style === 'mixed') {
        const keys = ['japanese', 'american', 'latin'];
        chosenPoolKey = keys[Math.floor(Math.random() * keys.length)];
      }
      const pool = PRO_NAME_POOLS[chosenPoolKey] || PRO_NAME_POOLS.japanese;
      const firstName = pool.first[Math.floor(Math.random() * pool.first.length)];
      const lastName = pool.last[Math.floor(Math.random() * pool.last.length)];
      return {
        firstName,
        lastName,
        fullName: `${firstName} ${lastName}`
      };
    }

    function parsePlayerNameParts(player) {
      if (player.firstName || player.lastName) {
        return { first: player.firstName || '', last: player.lastName || '' };
      }
      const raw = (player.name || '').trim();
      const parts = raw.split(/\s+/);
      if (parts.length >= 2) {
        return { first: parts[0], last: parts.slice(1).join(' ') };
      }
      return { first: '', last: raw };
    }

    function formatPlayerName(player, mode = null) {
      if (!player) return '';
      const fmt = mode || (db && db.league && db.league.nameFormat) || 'short';
      const { first, last } = parsePlayerNameParts(player);
      if (fmt === 'full') {
        return first && last ? `${first} ${last}` : (last || first || player.name || '');
      }
      if (first && last) {
        return `${first.charAt(0).toUpperCase()}. ${last}`;
      }
      return last || first || player.name || '';
    }

    function formatPlayerWithNumber(player, mode = null) {
      if (!player) return '';
      return `#${player.number} ${formatPlayerName(player, mode)}`;
    }

    function fmtRate(val) {
      if (!val || isNaN(val)) return '.000';
      if (val >= 1) return val.toFixed(3);
      return val.toFixed(3).replace(/^0/, '');
    }

    // 生成指定人數的陣容陣列 (保證包含 9 個野手 + 多名 P 投手)
    function generateRosterArray(count = 12, style = 'japanese', existingNumbers = new Set()) {
      const targetCount = Math.max(9, parseInt(count, 10) || 12);
      const fielderPositions = ['CF', 'SS', '1B', 'DH', 'RF', '3B', 'LF', '2B', 'C'];
      const batsThrows = ['R/R', 'L/L', 'L/R', 'S/R', 'R/R'];
      const usedNames = new Set();
      const usedNums = new Set(existingNumbers);
      const result = [];

      for (let i = 0; i < targetCount; i++) {
        // 前 9 人排滿野手位置，第 10 人起全部配置為 P 投手 (若總數為 9 人則第 9 人設為 P)
        let pos = 'P';
        if (targetCount === 9) {
          pos = i < 8 ? fielderPositions[i] : 'P';
        } else {
          pos = i < 9 ? fielderPositions[i] : 'P';
        }

        let nameObj = generateRandomProName(style);
        let guard = 0;
        while (usedNames.has(nameObj.fullName) && guard < 40) {
          nameObj = generateRandomProName(style);
          guard++;
        }
        usedNames.add(nameObj.fullName);

        let num = pos === 'P' ? (11 + (i % 45)) : (1 + ((i * 7) % 95));
        let numGuard = 0;
        while (usedNums.has(String(num)) && numGuard < 100) {
          num = Math.floor(Math.random() * 98) + 1;
          numGuard++;
        }
        usedNums.add(String(num));

        const bt = pos === 'P'
          ? (Math.random() > 0.3 ? 'R/R' : 'L/L')
          : batsThrows[i % batsThrows.length];

        result.push({
          id: 'p_' + Date.now() + '_' + i + '_' + Math.floor(Math.random() * 10000),
          number: String(num),
          firstName: nameObj.firstName,
          lastName: nameObj.lastName,
          name: nameObj.fullName,
          pos,
          bt,
          manualBat: emptyBat(),
          manualPitch: emptyPitch()
        });
      }
      return result;
    }

    // 智慧自動排定 1~9 棒先發打序 (嚴格優先挑選 pos !== 'P')
    function generateSmartLineup(team, targetDb = null) {
      const sourceDb = targetDb || (typeof db !== 'undefined' ? db : null);
      if (!team || !Array.isArray(team.players) || team.players.length === 0) return [];

      const statsMap = {};
      if (sourceDb && Array.isArray(sourceDb.teams)) {
        (team.players || []).forEach(p => {
          const mb = { ...emptyBat(), ...(p.manualBat || {}) };
          let ab = mb.ab, h = mb.h, d2 = mb.d2, d3 = mb.d3, hr = mb.hr, bb = mb.bb, hbp = mb.hbp, sf = mb.sf;
          (sourceDb.games || []).forEach(g => {
            (g.events || []).forEach(ev => {
              if (ev.batterId === p.id) {
                if (['1B', '2B', '3B', 'HR', 'SO', 'GO', 'FO', 'ROE', 'DP'].includes(ev.code)) ab++;
                if (['1B', '2B', '3B', 'HR'].includes(ev.code)) h++;
                if (ev.code === '2B') d2++;
                if (ev.code === '3B') d3++;
                if (ev.code === 'HR') hr++;
                if (['BB', 'IBB'].includes(ev.code)) bb++;
                if (ev.code === 'HBP') hbp++;
                if (ev.code === 'SF') sf++;
              }
            });
          });
          const b1 = Math.max(0, h - (d2 + d3 + hr));
          const tb = b1 + d2 * 2 + d3 * 3 + hr * 4;
          const avg = ab > 0 ? h / ab : 0;
          const obpDenom = ab + bb + hbp + sf;
          const obp = obpDenom > 0 ? (h + bb + hbp) / obpDenom : 0;
          const slg = ab > 0 ? tb / ab : 0;
          statsMap[p.id] = { ops: obp + slg, obp, slg, avg, hr };
        });
      }

      const fielders = team.players.filter(p => p.pos !== 'P');
      const pitchers = team.players.filter(p => p.pos === 'P');
      const pool = [...fielders];
      if (pool.length < 9) {
        pool.push(...pitchers.slice(0, 9 - pool.length));
      }

      const slotPosWeights = [
        { CF: 30, SS: 28, '2B': 26, LF: 22, RF: 20, DH: 15, UTIL: 15, '3B': 12, '1B': 8, C: 5, P: -50 },
        { SS: 30, RF: 28, LF: 26, '3B': 25, DH: 24, CF: 22, '2B': 20, '1B': 18, UTIL: 16, C: 10, P: -50 },
        { '1B': 30, '3B': 28, RF: 27, LF: 26, DH: 25, SS: 22, CF: 20, '2B': 15, UTIL: 14, C: 12, P: -50 },
        { DH: 32, '1B': 30, '3B': 28, LF: 26, RF: 25, C: 18, SS: 16, CF: 14, '2B': 10, UTIL: 12, P: -50 },
        { RF: 28, '1B': 27, '3B': 26, LF: 25, DH: 25, C: 22, SS: 18, CF: 16, '2B': 14, UTIL: 14, P: -50 },
        { LF: 24, RF: 24, '3B': 23, C: 22, '1B': 21, '2B': 20, SS: 19, CF: 18, DH: 18, UTIL: 18, P: -50 },
        { '2B': 24, C: 23, CF: 22, LF: 21, RF: 20, '3B': 19, SS: 18, '1B': 17, UTIL: 18, DH: 15, P: -50 },
        { C: 26, '2B': 23, '3B': 21, SS: 20, CF: 20, LF: 19, RF: 18, UTIL: 18, '1B': 15, DH: 12, P: -50 },
        { CF: 24, '2B': 23, SS: 22, C: 21, UTIL: 20, LF: 18, RF: 18, '3B': 16, '1B': 14, DH: 10, P: -50 }
      ];

      const remaining = [...pool];
      const lineup = [];
      const totalSlots = Math.min(9, remaining.length);

      for (let slot = 0; slot < totalSlots; slot++) {
        let bestIdx = 0;
        let bestScore = -Infinity;

        remaining.forEach((p, idx) => {
          const st = statsMap[p.id] || { ops: 0, obp: 0, slg: 0, avg: 0, hr: 0 };
          const posBonus = (slotPosWeights[slot] && slotPosWeights[slot][p.pos]) || 10;
          let statBonus = 0;
          if (slot === 0 || slot === 8) statBonus = st.obp * 45 + st.avg * 25;
          else if (slot === 1 || slot === 2) statBonus = st.ops * 40 + st.obp * 20;
          else if (slot === 3 || slot === 4) statBonus = st.slg * 45 + st.hr * 2.5 + st.ops * 20;
          else statBonus = st.ops * 30;

          const score = posBonus + statBonus - (idx * 0.05);
          if (score > bestScore) {
            bestScore = score;
            bestIdx = idx;
          }
        });

        const chosen = remaining.splice(bestIdx, 1)[0];
        lineup.push(chosen.id);
      }
      return lineup;
    }

    function ensureGameLineupsAndPitcher(g, sourceDb = null) {
      const targetDb = sourceDb || (typeof db !== 'undefined' ? db : null);
      if (!g || !targetDb) return;
      const awayTeam = (targetDb.teams || []).find(t => t.id === g.awayTeamId);
      const homeTeam = (targetDb.teams || []).find(t => t.id === g.homeTeamId);

      if (awayTeam) {
        const validAwayIds = new Set((awayTeam.players || []).map(p => p.id));
        const filteredAway = (Array.isArray(g.awayLineup) ? g.awayLineup : []).filter(id => validAwayIds.has(id));
        if (filteredAway.length === 0 && (awayTeam.players || []).length > 0) {
          g.awayLineup = generateSmartLineup(awayTeam, targetDb);
        } else {
          g.awayLineup = filteredAway;
        }
        if (g.awayOrderIdx === undefined || g.awayOrderIdx >= Math.max(1, g.awayLineup.length)) {
          g.awayOrderIdx = 0;
        }
      }

      if (homeTeam) {
        const validHomeIds = new Set((homeTeam.players || []).map(p => p.id));
        const filteredHome = (Array.isArray(g.homeLineup) ? g.homeLineup : []).filter(id => validHomeIds.has(id));
        if (filteredHome.length === 0 && (homeTeam.players || []).length > 0) {
          g.homeLineup = generateSmartLineup(homeTeam, targetDb);
        } else {
          g.homeLineup = filteredHome;
        }
        if (g.homeOrderIdx === undefined || g.homeOrderIdx >= Math.max(1, g.homeLineup.length)) {
          g.homeOrderIdx = 0;
        }
      }

      // 嚴格限定目前投手必須為 pos === 'P'
      const pitchingTeam = g.isTop ? homeTeam : awayTeam;
      if (pitchingTeam) {
        const teamPitchers = (pitchingTeam.players || []).filter(p => p.pos === 'P');
        const curPitcherObj = teamPitchers.find(p => p.id === g.currentPitcherId);
        if (!curPitcherObj) {
          const unusedP = teamPitchers.find(p => !(g.usedPitchers || []).includes(p.id)) || teamPitchers[0];
          g.currentPitcherId = unusedP ? unusedP.id : '';
          if (g.currentPitcherId && g.pitcherPitches[g.currentPitcherId] === undefined) {
            g.pitcherPitches[g.currentPitcherId] = 0;
          }
        }
      }

      const battingTeam = g.isTop ? awayTeam : homeTeam;
      const activeLineup = g.isTop ? (g.awayLineup || []) : (g.homeLineup || []);
      const activeOrderIdx = g.isTop ? (g.awayOrderIdx || 0) : (g.homeOrderIdx || 0);
      if (battingTeam && activeLineup.length > 0) {
        const validBatter = (battingTeam.players || []).find(p => p.id === g.currentBatterId);
        if (!validBatter) {
          g.currentBatterId = activeLineup[activeOrderIdx % activeLineup.length] || '';
        }
      }
    }

    function loadDB() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && parsed.league && Array.isArray(parsed.teams)) {
            if (!Array.isArray(parsed.games)) parsed.games = [];
            if (!parsed.manualMatchups || typeof parsed.manualMatchups !== 'object') parsed.manualMatchups = {};
            if (parsed.league.defaultPitchLimit === undefined) parsed.league.defaultPitchLimit = 85;
            if (parsed.league.autoSubPitcher === undefined) parsed.league.autoSubPitcher = true;
            parsed.games.forEach(g => {
              if (g.pitchLimit === undefined) g.pitchLimit = parsed.league.defaultPitchLimit || 85;
              if (g.autoSubPitcher === undefined) g.autoSubPitcher = parsed.league.autoSubPitcher !== false;
              if (!g.pitcherPitches) g.pitcherPitches = {};
              if (!Array.isArray(g.usedPitchers)) g.usedPitchers = [];
              ensureGameLineupsAndPitcher(g, parsed);
            });
            return parsed;
          }
        }
      } catch (e) {
        console.error('讀取資料庫失敗:', e);
      }
      const sample = createSampleLeagueData();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(sample));
      return sample;
    }

    function formatTimeNow() {

      return [now.getHours(), now.getMinutes(), now.getSeconds()]
        .map(n => String(n).padStart(2, '0'))
        .join(':');
    }

      if (txt) txt.textContent = `已自動儲存 ${t}`;

      e.preventDefault();
      db.league.name = document.getElementById('set-league-name').value.trim();
      db.league.season = document.getElementById('set-league-season').value.trim();
      db.league.inningsPerGame = parseInt(document.getElementById('set-league-innings').value, 10) || 9;
      db.league.nameFormat = document.getElementById('set-league-namefmt').value;
      db.league.defaultPitchLimit = Math.max(1, parseInt(document.getElementById('set-league-pitchlimit').value, 10) || 85);
      db.league.autoSubPitcher = document.getElementById('set-league-autosub').checked;
      closeModal();
      saveDB('聯盟與賽制設定已更新');
      renderWorkspace();
    }

    // =========================================================================
    // 2. 核心棒球數據自動統計運算引擎 (Auto-Stat Engine)
    // =========================================================================
    function computeAllPlayerStats() {
      const playerMap = {};

      (db.teams || []).forEach(team => {
        (team.players || []).forEach(player => {
          const mb = { ...emptyBat(), ...(player.manualBat || {}) };
          const mp = { ...emptyPitch(), ...(player.manualPitch || {}) };
          const manual1B = Math.max(0, mb.h - (mb.d2 + mb.d3 + mb.hr));

          playerMap[player.id] = {
            playerId: player.id,
            playerObj: player,
            number: player.number,
            name: player.name,
            displayName: formatPlayerName(player),
            fullName: formatPlayerName(player, 'full'),
            shortName: formatPlayerName(player, 'short'),
            pos: player.pos,
            bt: player.bt,
            teamId: team.id,
            teamName: team.name,
            teamCode: team.code,
            teamColor: team.color,
            gamesPlayedSet: new Set(),
            pitchGamesSet: new Set(),
            bat: {
              g: mb.g, ab: mb.ab, r: mb.r,
              b1: manual1B, b2: mb.d2, b3: mb.d3, hr: mb.hr,
              rbi: mb.rbi, bb: mb.bb, ibb: mb.ibb, hbp: mb.hbp,
              so: mb.so, sf: mb.sf, sh: mb.sh, sb: mb.sb, cs: mb.cs
            },
            pitch: {
              g: mp.g, w: mp.w, l: mp.l, sv: mp.sv, hld: mp.hld,
              ipOuts: mp.ipOuts, pitches: mp.pitches || 0, h: mp.h, r: mp.r, er: mp.er,
              hr: mp.hr, bb: mp.bb, hbp: mp.hbp, so: mp.so, bf: 0
            }
          };
        });
      });

      (db.games || []).forEach(game => {
        if (game.status === 'FINAL') {
          if (game.winPitcherId && playerMap[game.winPitcherId]) playerMap[game.winPitcherId].pitch.w += 1;
          if (game.losePitcherId && playerMap[game.losePitcherId]) playerMap[game.losePitcherId].pitch.l += 1;
          if (game.savePitcherId && playerMap[game.savePitcherId]) playerMap[game.savePitcherId].pitch.sv += 1;
        }

        if (game.pitcherPitches) {
          Object.entries(game.pitcherPitches).forEach(([pid, pCount]) => {
            if (playerMap[pid]) {
              playerMap[pid].pitch.pitches += (Number(pCount) || 0);
              if (pCount > 0) playerMap[pid].pitchGamesSet.add(game.id);
            }
          });
        }

        (game.events || []).forEach(ev => {
          const bStat = ev.batterId ? playerMap[ev.batterId] : null;
          const pStat = ev.pitcherId ? playerMap[ev.pitcherId] : null;

          if (bStat) bStat.gamesPlayedSet.add(game.id);
          if (pStat) pStat.pitchGamesSet.add(game.id);

          const code = ev.code;
          const rbi = Number(ev.rbi) || 0;
          const runs = Number(ev.runs) || 0;
          const er = Number(ev.er) || 0;
          const outsAdded = Number(ev.outsAdded) || 0;

          if (bStat && code !== 'SUB') {
            bStat.bat.rbi += rbi;
            if (code === 'HR') bStat.bat.r += 1;
            else if (ev.batterScored) bStat.bat.r += 1;

            switch (code) {
              case '1B': bStat.bat.ab += 1; bStat.bat.b1 += 1; break;
              case '2B': bStat.bat.ab += 1; bStat.bat.b2 += 1; break;
              case '3B': bStat.bat.ab += 1; bStat.bat.b3 += 1; break;
              case 'HR': bStat.bat.ab += 1; bStat.bat.hr += 1; break;
              case 'BB': bStat.bat.bb += 1; break;
              case 'IBB': bStat.bat.bb += 1; bStat.bat.ibb += 1; break;
              case 'HBP': bStat.bat.hbp += 1; break;
              case 'SO': bStat.bat.ab += 1; bStat.bat.so += 1; break;
              case 'GO':
              case 'FO':
              case 'ROE':
              case 'DP': bStat.bat.ab += 1; break;
              case 'SF': bStat.bat.sf += 1; break;
              case 'SH': bStat.bat.sh += 1; break;
              case 'SB': bStat.bat.sb += 1; break;
              case 'CS': bStat.bat.cs += 1; break;
            }
          }

          if (pStat && code !== 'SUB') {
            pStat.pitch.ipOuts += outsAdded;
            pStat.pitch.r += runs;
            pStat.pitch.er += er;

            switch (code) {
              case '1B':
              case '2B':
              case '3B': pStat.pitch.h += 1; pStat.pitch.bf += 1; break;
              case 'HR': pStat.pitch.h += 1; pStat.pitch.hr += 1; pStat.pitch.bf += 1; break;
              case 'BB':
              case 'IBB': pStat.pitch.bb += 1; break;
              case 'HBP': pStat.pitch.hbp += 1; break;
              case 'SO': pStat.pitch.so += 1; pStat.pitch.bf += 1; break;
              case 'GO':
              case 'FO':
              case 'ROE':
              case 'DP': pStat.pitch.bf += 1; break;
            }
          }
        });
      });

      const regInnings = Number(db.league.inningsPerGame) || 9;

      return Object.values(playerMap).map(item => {
        const b = item.bat;
        const totalG = b.g + item.gamesPlayedSet.size;
        const h = b.b1 + b.b2 + b.b3 + b.hr;
        const tb = b.b1 + (b.b2 * 2) + (b.b3 * 3) + (b.hr * 4);
        const pa = b.ab + b.bb + b.hbp + b.sf + b.sh;

        const avg = b.ab > 0 ? h / b.ab : 0;
        const obpDenom = b.ab + b.bb + b.hbp + b.sf;
        const obp = obpDenom > 0 ? (h + b.bb + b.hbp) / obpDenom : 0;
        const slg = b.ab > 0 ? tb / b.ab : 0;
        const ops = obp + slg;

        const p = item.pitch;
        const pitchG = p.g + item.pitchGamesSet.size;
        const exactInnings = p.ipOuts / 3;
        const ipDisplay = `${Math.floor(p.ipOuts / 3)}.${p.ipOuts % 3}`;
        const era = exactInnings > 0 ? (p.er * regInnings) / exactInnings : (p.er > 0 ? 99.99 : 0);
        const whip = exactInnings > 0 ? (p.bb + p.h) / exactInnings : (p.bb + p.h > 0 ? 99.99 : 0);
        const k9 = exactInnings > 0 ? (p.so * regInnings) / exactInnings : 0;
        const baa = p.bf > 0 ? p.h / p.bf : 0;

        return {
          ...item,
          battingSummary: {
            g: totalG, pa, ab: b.ab, r: b.r, h,
            b1: b.b1, b2: b.b2, b3: b.b3, hr: b.hr, tb,
            rbi: b.rbi, bb: b.bb, hbp: b.hbp, so: b.so, sf: b.sf, sh: b.sh, sb: b.sb, cs: b.cs,
            avg, obp, slg, ops
          },
          pitchingSummary: {
            g: pitchG, w: p.w, l: p.l, sv: p.sv, hld: p.hld,
            ipOuts: p.ipOuts, exactInnings, ipDisplay, pitches: p.pitches,
            h: p.h, r: p.r, er: p.er, hr: p.hr, bb: p.bb, hbp: p.hbp, so: p.so,
            era, whip, k9, baa
          }
        };
      });
    }

    // 生涯投打對決數據自動統計與手動基準合併引擎 (Batter vs. Pitcher)
    function computeCareerMatchups() {
      const playerLookup = {};
      (db.teams || []).forEach(team => {
        (team.players || []).forEach(p => {
          playerLookup[p.id] = { player: p, team };
        });
      });

      const pairMap = {};
      const ensurePair = (bId, pId) => {
        const key = `${bId}__${pId}`;
        if (!pairMap[key]) {
          const bInfo = playerLookup[bId];
          const pInfo = playerLookup[pId];
          if (!bInfo || !pInfo) return null;
          const manual = (db.manualMatchups && db.manualMatchups[key])
            ? { ...emptyMatchup(), ...db.manualMatchups[key] }
            : emptyMatchup();
          const m1B = Math.max(0, manual.h - (manual.d2 + manual.d3 + manual.hr));
          pairMap[key] = {
            key,
            batterId: bId,
            pitcherId: pId,
            batter: bInfo.player,
            batterTeam: bInfo.team,
            pitcher: pInfo.player,
            pitcherTeam: pInfo.team,
            ab: manual.ab,
            b1: m1B,
            b2: manual.d2,
            b3: manual.d3,
            hr: manual.hr,
            rbi: manual.rbi,
            bb: manual.bb,
            hbp: manual.hbp,
            so: manual.so,
            sf: manual.sf,
            sh: 0,
            roe: 0,
            history: []
          };
        }
        return pairMap[key];
      };

      if (db.manualMatchups) {
        Object.keys(db.manualMatchups).forEach(key => {
          const [bId, pId] = key.split('__');
          if (bId && pId) ensurePair(bId, pId);
        });
      }

      (db.games || []).forEach(game => {
        const events = game.events || [];
        // 依時間正序遍歷以建立歷史交手序列
        for (let i = events.length - 1; i >= 0; i--) {
          const ev = events[i];
          if (!ev.batterId || !ev.pitcherId || ev.code === 'SUB' || ev.code === 'SB' || ev.code === 'CS') continue;
          const pair = ensurePair(ev.batterId, ev.pitcherId);
          if (!pair) continue;

          const code = ev.code;
          pair.rbi += (Number(ev.rbi) || 0);

          switch (code) {
            case '1B': pair.ab += 1; pair.b1 += 1; break;
            case '2B': pair.ab += 1; pair.b2 += 1; break;
            case '3B': pair.ab += 1; pair.b3 += 1; break;
            case 'HR': pair.ab += 1; pair.hr += 1; break;
            case 'BB':
            case 'IBB': pair.bb += 1; break;
            case 'HBP': pair.hbp += 1; break;
            case 'SO': pair.ab += 1; pair.so += 1; break;
            case 'GO':
            case 'FO':
            case 'DP': pair.ab += 1; break;
            case 'ROE': pair.ab += 1; pair.roe += 1; break;
            case 'SF': pair.sf += 1; break;
            case 'SH': pair.sh += 1; break;
          }

          pair.history.unshift({
            eventId: ev.id,
            gameId: game.id,
            gameTitle: game.title || '例行賽',
            date: game.date || '',
            inning: ev.inning || '',
            code,
            label: ev.label || code,
            rbi: Number(ev.rbi) || 0,
            text: ev.text || ''
          });
        }
      });

      return Object.values(pairMap).map(m => {
        const h = m.b1 + m.b2 + m.b3 + m.hr;
        const tb = m.b1 + m.b2 * 2 + m.b3 * 3 + m.hr * 4;
        const pa = m.ab + m.bb + m.hbp + m.sf + m.sh;
        const avg = m.ab > 0 ? h / m.ab : 0;
        const obpDenom = m.ab + m.bb + m.hbp + m.sf;
        const obp = obpDenom > 0 ? (h + m.bb + m.hbp) / obpDenom : 0;
        const slg = m.ab > 0 ? tb / m.ab : 0;
        const ops = obp + slg;
        const outsRecorded = Math.max(0, m.ab - h - m.roe + m.sf + m.sh);
        return {
          ...m,
          h,
          tb,
          pa,
          outsRecorded,
          avg,
          obp,
          slg,
          ops
        };
      });
    }

    function getSingleMatchupStats(batterId, pitcherId) {
      if (!batterId || !pitcherId) return null;
      const all = computeCareerMatchups();
      const found = all.find(x => x.batterId === batterId && x.pitcherId === pitcherId);
      if (found) return found;

      let batter = null, batterTeam = null, pitcher = null, pitcherTeam = null;
      (db.teams || []).forEach(t => {
        (t.players || []).forEach(p => {
          if (p.id === batterId) { batter = p; batterTeam = t; }
          if (p.id === pitcherId) { pitcher = p; pitcherTeam = t; }
        });
      });
      if (!batter || !pitcher) return null;
      return {
        key: `${batterId}__${pitcherId}`,
        batterId,
        pitcherId,
        batter,
        batterTeam,
        pitcher,
        pitcherTeam,
        ab: 0, b1: 0, b2: 0, b3: 0, hr: 0, h: 0, tb: 0,
        rbi: 0, bb: 0, hbp: 0, so: 0, sf: 0, sh: 0, roe: 0,
        pa: 0, outsRecorded: 0, avg: 0, obp: 0, slg: 0, ops: 0,
        history: []
      };
    }

    function renderGameConsole(g) {
      const away = getTeamById(g.awayTeamId);
      const home = getTeamById(g.homeTeamId);
      const aRuns = calcGameRuns(g, 'away');
      const hRuns = calcGameRuns(g, 'home');

      const battingTeam = g.isTop ? away : home;
      const pitchingTeam = g.isTop ? home : away;

      ensureGameLineupsAndPitcher(g);

      const curBatterObj = (battingTeam.players || []).find(p => p.id === g.currentBatterId);
      const pitchingTeamPitchers = (pitchingTeam.players || []).filter(p => p.pos === 'P');
      const curPitcherObj = pitchingTeamPitchers.find(p => p.id === g.currentPitcherId);

      const activeBattingLineup = g.isTop ? (g.awayLineup || []) : (g.homeLineup || []);
      const activeOrderIdx = g.isTop ? (g.awayOrderIdx || 0) : (g.homeOrderIdx || 0);
      const batterSlotInLineup = activeBattingLineup.indexOf(g.currentBatterId);
      const displayBattingOrder = batterSlotInLineup >= 0 ? (batterSlotInLineup + 1) : ((activeOrderIdx % Math.max(1, activeBattingLineup.length)) + 1);

      const lineupSide = ui.lineupViewSide === 'home' ? 'home' : 'away';
      const lineupTeam = lineupSide === 'away' ? away : home;
      const lineupIds = lineupSide === 'away' ? (g.awayLineup || []) : (g.homeLineup || []);
      const lineupCurrentIdx = lineupSide === 'away' ? (g.awayOrderIdx || 0) : (g.homeOrderIdx || 0);

      if (!g.pitcherPitches) g.pitcherPitches = {};
      if (!Array.isArray(g.usedPitchers)) g.usedPitchers = [];
      const curPitches = curPitcherObj ? (Number(g.pitcherPitches[curPitcherObj.id]) || 0) : 0;
      const pitchLimit = Number(g.pitchLimit) || Number(db.league.defaultPitchLimit) || 85;
      const autoSubEnabled = g.autoSubPitcher !== false;
      const pitchRatio = pitchLimit > 0 ? Math.min(100, Math.round((curPitches / pitchLimit) * 100)) : 0;
      const isOverLimit = curPitcherObj && curPitches >= pitchLimit;
      const isNearLimit = curPitcherObj && !isOverLimit && curPitches >= Math.floor(pitchLimit * 0.75);

      const barColorClass = isOverLimit ? 'bg-rose-500' : isNearLimit ? 'bg-amber-400' : 'bg-emerald-400';
      const badgeColorClass = isOverLimit
        ? 'bg-rose-500/20 text-rose-300 border-rose-500/50'
        : isNearLimit
        ? 'bg-amber-500/20 text-amber-300 border-amber-500/50'
        : 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40';

      const availableRelievers = pitchingTeamPitchers.filter(
        p => p.id !== g.currentPitcherId && !g.usedPitchers.includes(p.id)
      );

      const allPlayerStats = computeAllPlayerStats();
      const bStatObj = curBatterObj ? allPlayerStats.find(x => x.playerId === curBatterObj.id)?.battingSummary : null;
      const liveAvgStr = bStatObj ? fmtRate(bStatObj.avg) : '.000';
      const liveOpsStr = bStatObj ? fmtRate(bStatObj.ops) : '.000';
      const liveHitsAb = bStatObj ? `${bStatObj.h}-${bStatObj.ab}` : '0-0';

      // 取得目前投打組合的生涯對決數據
      const liveMatchup = (curBatterObj && curPitcherObj)
        ? getSingleMatchupStats(curBatterObj.id, curPitcherObj.id)
        : null;

      const totalInnings = Math.max(db.league.inningsPerGame || 9, g.inningsAway.length);
      let thHtml = '', awayCells = '', homeCells = '';
      for (let i = 0; i < totalInnings; i++) {
        const activeCol = g.status === 'LIVE' && g.inning === i + 1;
        thHtml += `<th class="py-1.5 px-1 text-center min-w-[32px] ${activeCol ? 'bg-emerald-500/20 text-emerald-400' : ''}">${i + 1}</th>`;
        const av = g.inningsAway[i] !== null && g.inningsAway[i] !== undefined ? g.inningsAway[i] : '';
        const hv = g.inningsHome[i] !== null && g.inningsHome[i] !== undefined ? g.inningsHome[i] : '';
        awayCells += `
          <td class="p-0.5 text-center ${activeCol && g.isTop ? 'bg-emerald-500/15' : ''}">
            <input type="number" min="0" value="${av}" placeholder="-" onchange="setInningRun('${g.id}', 'away', ${i}, this.value)"
              class="w-7 h-7 text-center bg-slate-950 border border-slate-700 focus:border-emerald-400 rounded text-xs font-bold text-white outline-none tabular-nums">
          </td>`;
        homeCells += `
          <td class="p-0.5 text-center ${activeCol && !g.isTop ? 'bg-emerald-500/15' : ''}">
            <input type="number" min="0" value="${hv}" placeholder="-" onchange="setInningRun('${g.id}', 'home', ${i}, this.value)"
              class="w-7 h-7 text-center bg-slate-950 border border-slate-700 focus:border-emerald-400 rounded text-xs font-bold text-white outline-none tabular-nums">
          </td>`;
      }

      return `
        <div class="bg-[#0B132B] border border-slate-800 rounded-2xl overflow-hidden shadow-xl space-y-4 pb-5">
          <!-- 控制台頂部狀態列 -->
          <div class="bg-slate-800/80 px-4 py-3 border-b border-slate-700/80 flex flex-wrap items-center justify-between gap-2">
            <div class="flex items-center gap-2">
              <span class="text-xs font-black text-emerald-400"><i class="fa-solid fa-calculator mr-1"></i> 即時記分與數據連動控制台</span>
              <span class="text-[11px] text-slate-400">${g.title} • ${g.venue}</span>
            </div>
            <div class="flex items-center gap-2">
              <span class="text-[11px] text-slate-400">狀態：</span>
              <select onchange="setGameStatus('${g.id}', this.value)" class="bg-slate-950 border border-slate-700 text-xs font-bold text-white rounded-lg px-2.5 py-1 outline-none focus:border-emerald-400">
                <option value="UPCOMING" ${g.status === 'UPCOMING' ? 'selected' : ''}>未開賽</option>
                <option value="LIVE" ${g.status === 'LIVE' ? 'selected' : ''}>進行中 (LIVE)</option>
                <option value="FINAL" ${g.status === 'FINAL' ? 'selected' : ''}>已結束 (計入戰績)</option>
              </select>
            </div>
          </div>

          <!-- 1. 比數與局數控制看板 -->
          <div class="px-4">
            <div class="bg-slate-950 border border-slate-800 rounded-2xl p-4 flex items-center justify-between">
              <div class="flex flex-col items-center w-24 sm:w-28 text-center">
                ${renderTeamLogo(away, 'lg')}
                <span class="text-xs sm:text-sm font-black text-white mt-1.5 truncate w-full">${away.name}</span>
                <span class="text-[10px] text-slate-400">客隊 (先攻)</span>
              </div>

              <div class="flex flex-col items-center">
                <div class="flex items-center gap-4 sm:gap-6">
                  <span class="text-4xl sm:text-5xl font-black tabular-nums text-white">${aRuns}</span>
                  <div class="flex flex-col items-center">
                    <span class="text-[11px] font-black px-2.5 py-0.5 rounded-full bg-emerald-500 text-slate-950 mb-1">
                      ${g.inning}局${g.isTop ? '上' : '下'}
                    </span>
                    <div class="flex items-center gap-1 mt-1">
                      <button type="button" onclick="stepInning('${g.id}', -1)" class="px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-[10px] font-bold text-slate-300">-1局</button>
                      <button type="button" onclick="flipHalfInning('${g.id}')" class="px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-[10px] font-bold text-emerald-400">上/下</button>
                      <button type="button" onclick="stepInning('${g.id}', 1)" class="px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-[10px] font-bold text-slate-300">+1局</button>
                    </div>
                  </div>
                  <span class="text-4xl sm:text-5xl font-black tabular-nums text-white">${hRuns}</span>
                </div>
              </div>

              <div class="flex flex-col items-center w-24 sm:w-28 text-center">
                ${renderTeamLogo(home, 'lg')}
                <span class="text-xs sm:text-sm font-black text-white mt-1.5 truncate w-full">${home.name}</span>
                <span class="text-[10px] text-slate-400">主隊 (後攻)</span>
              </div>
            </div>
          </div>

          <!-- 2. 各局記分板 (R / H / E) -->
          <div class="px-4">
            <div class="bg-slate-950 border border-slate-800 rounded-2xl p-3 overflow-x-auto">
              <table class="w-full text-xs tabular-nums border-collapse">
                <thead>
                  <tr class="text-slate-400 border-b border-slate-800 text-[11px]">
                    <th class="py-1.5 px-2 text-left min-w-[90px]">球隊</th>
                    ${thHtml}
                    <th class="py-1.5 px-1 text-center"><button type="button" onclick="appendExtraInning('${g.id}')" class="text-[10px] bg-slate-800 hover:bg-slate-700 text-emerald-400 px-1.5 py-0.5 rounded font-bold" title="新增延長局">+局</button></th>
                    <th class="py-1.5 px-2 text-center font-black text-white">R</th>
                    <th class="py-1.5 px-2 text-center font-bold text-slate-300">H</th>
                    <th class="py-1.5 px-2 text-center font-bold text-slate-300">E</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-800/60">
                  <tr>
                    <td class="py-1.5 px-2 font-black text-white truncate">${away.code}</td>
                    ${awayCells}
                    <td></td>
                    <td class="py-1.5 px-2 text-center font-black text-emerald-400 text-sm">${aRuns}</td>
                    <td class="py-1.5 px-2 text-center text-slate-300">${g.awayHits || 0}</td>
                    <td class="py-1.5 px-2 text-center text-slate-300">${g.awayErrors || 0}</td>
                  </tr>
                  <tr>
                    <td class="py-1.5 px-2 font-black text-white truncate">${home.code}</td>
                    ${homeCells}
                    <td></td>
                    <td class="py-1.5 px-2 text-center font-black text-emerald-400 text-sm">${hRuns}</td>
                    <td class="py-1.5 px-2 text-center text-slate-300">${g.homeHits || 0}</td>
                    <td class="py-1.5 px-2 text-center text-slate-300">${g.homeErrors || 0}</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>

          <!-- 3. 壘包狀況、BSO 與「投打對決顯示卡 + 用球數上限自動換投」 -->
          <div class="px-4 grid grid-cols-1 md:grid-cols-12 gap-3">
            <div class="md:col-span-5 bg-slate-950 border border-slate-800 rounded-2xl p-3.5 flex items-center justify-around">
              <div class="flex flex-col items-center">
                <div class="relative w-20 h-16 flex items-center justify-center">
                  <div onclick="toggleGameBase('${g.id}', 1)" title="點擊切換二壘跑者" class="w-5 h-5 border-2 diamond-base absolute top-1 ${g.bases[1] ? 'bg-amber-400 border-amber-300 shadow-[0_0_12px_rgba(251,191,36,0.9)]' : 'bg-slate-800 border-slate-600'}"></div>
                  <div onclick="toggleGameBase('${g.id}', 2)" title="點擊切換三壘跑者" class="w-5 h-5 border-2 diamond-base absolute left-2.5 top-6 ${g.bases[2] ? 'bg-amber-400 border-amber-300 shadow-[0_0_12px_rgba(251,191,36,0.9)]' : 'bg-slate-800 border-slate-600'}"></div>
                  <div onclick="toggleGameBase('${g.id}', 0)" title="點擊切換一壘跑者" class="w-5 h-5 border-2 diamond-base absolute right-2.5 top-6 ${g.bases[0] ? 'bg-amber-400 border-amber-300 shadow-[0_0_12px_rgba(251,191,36,0.9)]' : 'bg-slate-800 border-slate-600'}"></div>
                </div>
                <span class="text-[10px] text-slate-400 mt-1">點擊切換壘包</span>
              </div>

              <div class="w-[1px] h-16 bg-slate-800"></div>

              <div class="space-y-2 text-xs font-black">
                <div onclick="cycleGameBSO('${g.id}', 'balls')" class="flex items-center gap-2 cursor-pointer select-none">
                  <span class="w-3 text-emerald-400">B</span>
                  <div class="flex gap-1.5">${[0,1,2].map(i => `<span class="w-3.5 h-3.5 rounded-full border border-emerald-500/40 ${i < g.balls ? 'bg-emerald-400 shadow-[0_0_8px_#34d399]' : 'bg-slate-800'}"></span>`).join('')}</div>
                </div>
                <div onclick="cycleGameBSO('${g.id}', 'strikes')" class="flex items-center gap-2 cursor-pointer select-none">
                  <span class="w-3 text-amber-400">S</span>
                  <div class="flex gap-1.5">${[0,1].map(i => `<span class="w-3.5 h-3.5 rounded-full border border-amber-500/40 ${i < g.strikes ? 'bg-amber-400 shadow-[0_0_8px_#fbbf24]' : 'bg-slate-800'}"></span>`).join('')}</div>
                </div>
                <div onclick="cycleGameBSO('${g.id}', 'outs')" class="flex items-center gap-2 cursor-pointer select-none">
                  <span class="w-3 text-rose-500">O</span>
                  <div class="flex gap-1.5">${[0,1].map(i => `<span class="w-3.5 h-3.5 rounded-full border border-rose-500/40 ${i < g.outs ? 'bg-rose-500 shadow-[0_0_8px_#f43f5e]' : 'bg-slate-800'}"></span>`).join('')}</div>
                </div>
              </div>
            </div>

            <div class="md:col-span-7 bg-slate-950 border border-slate-800 rounded-2xl p-3.5 space-y-2.5">
              <!-- 即時投打對決條與打者即時三圍 -->
              <div class="bg-slate-900/90 border border-slate-800 rounded-xl px-3 py-2 space-y-1.5 text-xs">
                <div class="flex items-center justify-between">
                  <div class="flex items-center gap-1.5 truncate">
                    <span class="px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-400 font-black text-[10px]">第 ${displayBattingOrder} 棒</span>
                    <span class="font-black text-white truncate">${curBatterObj ? formatPlayerWithNumber(curBatterObj) : '未選擇打者'}</span>
                  </div>
                  <span class="text-slate-600 font-black px-2">VS</span>
                  <div class="flex items-center gap-1.5 truncate">
                    <span class="px-1.5 py-0.5 rounded bg-sky-500/20 text-sky-400 font-black text-[10px]">投手 (P)</span>
                    <span class="font-black text-white truncate">${curPitcherObj ? formatPlayerWithNumber(curPitcherObj) : '無可用投手 (P)'}</span>
                  </div>
                </div>
                ${curBatterObj ? `
                  <div class="flex items-center justify-between pt-1 border-t border-slate-800/80 text-[11px] tabular-nums">
                    <span class="text-slate-400">打者即時三圍：</span>
                    <div class="flex items-center gap-2.5">
                      <span class="text-emerald-400 font-black">AVG ${liveAvgStr} <span class="text-slate-400 font-normal">(${liveHitsAb})</span></span>
                      <span class="text-amber-300 font-bold">OPS ${liveOpsStr}</span>
                    </div>
                  </div>
                ` : ''}
                ${liveMatchup ? `
                  <div class="pt-1.5 border-t border-slate-800/80 space-y-1.5">
                    <div class="flex flex-wrap items-center justify-between gap-1 text-[11px]">
                      <span class="font-black text-orange-400 flex items-center gap-1">
                        <i class="fa-solid fa-swords"></i> 生涯投打對決
                      </span>
                      ${liveMatchup.pa === 0 ? `
                        <span class="px-2 py-0.5 rounded-full bg-orange-500/20 border border-orange-500/40 text-orange-300 font-black text-[10px]">
                          🆕 生涯首度投打對決
                        </span>
                      ` : `
                        <div class="flex items-center gap-2 tabular-nums">
                          <span class="px-1.5 py-0.5 rounded bg-orange-500/20 text-orange-300 font-black">對戰 AVG ${fmtRate(liveMatchup.avg)} (${liveMatchup.h}-${liveMatchup.ab})</span>
                          <span class="text-sky-300 font-bold">OPS ${fmtRate(liveMatchup.ops)}</span>
                          <span class="text-slate-300">HR:${liveMatchup.hr} RBI:${liveMatchup.rbi} BB:${liveMatchup.bb} SO:${liveMatchup.so}</span>
                          <button type="button" onclick="jumpToMatchupAnalyzer('${curBatterObj.id}', '${curPitcherObj.id}')" class="text-[10px] text-orange-300 hover:text-orange-200 underline font-bold">詳情</button>
                        </div>
                      `}
                    </div>
                    ${liveMatchup.history.length > 0 ? `
                      <div class="flex items-center gap-1 overflow-x-auto no-scrollbar text-[10px]">
                        <span class="text-slate-500 shrink-0">近5次：</span>
                        ${liveMatchup.history.slice(0, 5).map(hItem => {
                          const isHit = ['1B', '2B', '3B', 'HR'].includes(hItem.code);
                          const isBB = ['BB', 'IBB', 'HBP'].includes(hItem.code);
                          const tagCls = hItem.code === 'HR'
                            ? 'bg-amber-500/30 text-amber-300 border-amber-400/50'
                            : isHit
                            ? 'bg-emerald-500/25 text-emerald-300 border-emerald-500/40'
                            : isBB
                            ? 'bg-sky-500/25 text-sky-300 border-sky-500/40'
                            : 'bg-slate-800 text-slate-400 border-slate-700';
                          return `<span class="px-1.5 py-0.2 rounded border font-black shrink-0 ${tagCls}">${hItem.code}</span>`;
                        }).join('')}
                      </div>
                    ` : ''}
                  </div>
                ` : ''}
              </div>

              <!-- 投打下拉選單 (投手區嚴格僅限 pos === 'P') -->
              <div class="grid grid-cols-2 gap-2.5">
                <div>
                  <label class="text-[10px] font-bold text-amber-400 block mb-1">打者 / 代打 (${battingTeam.name})</label>
                  <select onchange="handleManualBatterSelect('${g.id}', this.value)" class="w-full bg-slate-900 border border-slate-700 focus:border-emerald-400 rounded-xl px-2.5 py-1.5 text-xs font-bold text-white outline-none">
                    <option value="">-- 選擇打者 --</option>
                    ${(battingTeam.players || []).map(p => {
                      const slot = activeBattingLineup.indexOf(p.id);
                      const slotTag = slot >= 0 ? `[${slot + 1}棒] ` : '';
                      return `<option value="${p.id}" ${g.currentBatterId === p.id ? 'selected' : ''}>${slotTag}#${p.number} ${formatPlayerName(p)} (${p.pos})</option>`;
                    }).join('')}
                  </select>
                </div>
                <div>
                  <label class="text-[10px] font-bold text-sky-400 block mb-1">投手區 — 僅限 P (${pitchingTeamPitchers.length}人)</label>
                  <select id="pitcher-select-${g.id}" onchange="manualSwitchPitcher('${g.id}', this.value)" class="w-full bg-slate-900 border border-slate-700 focus:border-emerald-400 rounded-xl px-2.5 py-1.5 text-xs font-bold text-white outline-none">
                    ${pitchingTeamPitchers.length === 0 ? `<option value="">-- 該隊尚無登錄投手 (P) --</option>` : `
                      <option value="">-- 選擇投手 (僅限 P) --</option>
                      ${pitchingTeamPitchers.map(p => {
                        const isUsed = g.usedPitchers.includes(p.id) && p.id !== g.currentPitcherId;
                        const pCnt = g.pitcherPitches[p.id] || 0;
                        return `<option value="${p.id}" ${g.currentPitcherId === p.id ? 'selected' : ''}>#${p.number} ${formatPlayerName(p)} (P) [${pCnt}球]${isUsed ? ' (已退場)' : ''}</option>`;
                      }).join('')}
                    `}
                  </select>
                </div>
              </div>

              <!-- 用球數即時監控、手動加減球與自動換投控制列 -->
              <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-2.5 space-y-2">
                <div class="flex flex-wrap items-center justify-between gap-2">
                  <div class="flex items-center gap-2">
                    <span class="px-2 py-0.5 rounded-lg border text-[11px] font-black tabular-nums ${badgeColorClass}">
                      <i class="fa-solid fa-gauge-high mr-1"></i>用球數: ${curPitches} / ${pitchLimit} 球
                    </span>
                    <div class="flex items-center gap-1">
                      <button type="button" onclick="adjustCurrentPitcherPitches('${g.id}', -1)" class="px-1.5 py-0.5 rounded bg-slate-800 hover:bg-slate-700 border border-slate-700 text-[10px] font-bold text-slate-300">-1</button>
                      <button type="button" onclick="adjustCurrentPitcherPitches('${g.id}', 1)" class="px-1.5 py-0.5 rounded bg-slate-800 hover:bg-slate-700 border border-slate-700 text-[10px] font-bold text-emerald-300">+1</button>
                      <button type="button" onclick="adjustCurrentPitcherPitches('${g.id}', 5)" class="px-1.5 py-0.5 rounded bg-slate-800 hover:bg-slate-700 border border-slate-700 text-[10px] font-bold text-amber-300">+5</button>
                    </div>
                  </div>

                  <div class="flex items-center gap-2 text-[11px]">
                    <div class="flex items-center gap-1 text-slate-400">
                      <span>上限:</span>
                      <input type="number" min="1" max="300" value="${pitchLimit}" onchange="updateGamePitchLimit('${g.id}', this.value)"
                        class="w-12 bg-slate-950 border border-slate-700 focus:border-sky-400 rounded px-1.5 py-0.5 text-center text-white font-black outline-none tabular-nums">
                    </div>
                    <label class="inline-flex items-center gap-1 cursor-pointer select-none bg-slate-950 border border-slate-700 px-2 py-0.5 rounded-lg">
                      <input type="checkbox" ${autoSubEnabled ? 'checked' : ''} onchange="toggleGameAutoSub('${g.id}', this.checked)" class="accent-sky-400">
                      <span class="font-bold ${autoSubEnabled ? 'text-sky-300' : 'text-slate-500'}">自動換投</span>
                    </label>
                  </div>
                </div>

                <div class="w-full h-1.5 bg-slate-950 rounded-full overflow-hidden">
                  <div class="h-full transition-all duration-300 ${barColorClass}" style="width: ${pitchRatio}%"></div>
                </div>

                ${g.lastAutoSubInfo ? `
                  <div class="bg-sky-950/80 border border-sky-500/50 rounded-lg px-2.5 py-1.5 flex flex-wrap items-center justify-between gap-2 text-[11px]">
                    <span class="text-sky-200 font-bold"><i class="fa-solid fa-rotate mr-1 text-sky-400"></i>${g.lastAutoSubInfo.message}</span>
                    <div class="flex items-center gap-1.5 shrink-0">
                      <button type="button" onclick="undoLastAutoSub('${g.id}')" class="px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-amber-300 font-bold border border-slate-700">復原換投</button>
                      <button type="button" onclick="document.getElementById('pitcher-select-${g.id}')?.focus()" class="px-2 py-0.5 rounded bg-sky-600 hover:bg-sky-500 text-white font-bold">手動指定投手</button>
                    </div>
                  </div>
                ` : ''}

                ${pitchingTeamPitchers.length === 0 ? `
                  <div class="bg-rose-950/80 border border-rose-500/60 rounded-lg px-2.5 py-1.5 text-[11px] font-black text-rose-300 flex items-center justify-between gap-2">
                    <span>⚠️ ${pitchingTeam.name} 尚無登錄投手（僅限守備位置 P 登板）</span>
                    <button type="button" onclick="switchTab('league')" class="underline text-amber-300 shrink-0">前往新增投手</button>
                  </div>
                ` : (isOverLimit && availableRelievers.length === 0 ? `
                  <div class="bg-rose-950/80 border border-rose-500/60 rounded-lg px-2.5 py-1.5 text-[11px] font-black text-rose-300">
                    ⚠️ 牛棚已無可用投手（僅限守備位置 P 登板），請至球隊名單新增投手或調整用球上限
                  </div>
                ` : '')}
              </div>
            </div>
          </div>

          <!-- 3.5 先發打序管理與一鍵智慧排打序面板 (1~9 棒) -->
          <div class="px-4">
            <div class="bg-slate-950 border border-slate-800 rounded-2xl p-3.5 space-y-3">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <div class="flex items-center gap-2">
                  <span class="text-xs font-black text-white"><i class="fa-solid fa-list-ol text-amber-400 mr-1.5"></i>先發打序管理 (1～9 棒)</span>
                  <div class="flex bg-slate-900 p-0.5 rounded-lg border border-slate-800">
                    <button type="button" onclick="setLineupViewSide('away')" class="px-2.5 py-1 rounded-md text-[11px] font-black transition ${lineupSide === 'away' ? 'bg-amber-500 text-slate-950' : 'text-slate-400 hover:text-white'}">
                      客隊: ${away.name}
                    </button>
                    <button type="button" onclick="setLineupViewSide('home')" class="px-2.5 py-1 rounded-md text-[11px] font-black transition ${lineupSide === 'home' ? 'bg-emerald-500 text-slate-950' : 'text-slate-400 hover:text-white'}">
                      主隊: ${home.name}
                    </button>
                  </div>
                </div>
                <div class="flex flex-wrap items-center gap-1.5">

          <!-- 6. 逐打席文字戰報時間軸 -->
          <div class="px-4">

    // =========================================================================
    // 5. 賽程與打席紀錄控制台操作函式
    // =========================================================================
    function selectGame(id) {
      ui.selectedGameId = id;
      renderWorkspace();
    }

    function setLineupViewSide(side) {
      ui.lineupViewSide = side;
      renderWorkspace();
    }

    function setGameStatus(gameId, status) {
      const g = db.games.find(x => x.id === gameId);
      if (g) {
        g.status = status;
        saveDB(status === 'FINAL' ? '比賽已設為結束，已自動計入戰績表！' : '比賽狀態已更新');
        renderWorkspace();
      }
    }

    function setGameProp(gameId, key, val) {
      const g = db.games.find(x => x.id === gameId);
      if (g) {
        g[key] = val;
        saveDB('已更新投手勝敗紀錄');
        renderWorkspace();
      }
    }

    function autoArrangeGameLineup(gameId, side, mode = 'smart') {
      const g = db.games.find(x => x.id === gameId);
      if (!g) return;
      const team = getTeamById(side === 'away' ? g.awayTeamId : g.homeTeamId);
      let newLineup = [];

      if (mode === 'avg') {
        const allStats = computeAllPlayerStats();
        const fielders = (team.players || []).filter(p => p.pos !== 'P');
        const pitchers = (team.players || []).filter(p => p.pos === 'P');
        const pool = fielders.length >= 9 ? fielders : [...fielders, ...pitchers.slice(0, 9 - fielders.length)];
        pool.sort((a, b) => {
          const sa = allStats.find(x => x.playerId === a.id)?.battingSummary || { avg: 0, ops: 0 };
          const sb = allStats.find(x => x.playerId === b.id)?.battingSummary || { avg: 0, ops: 0 };
          return (sb.avg - sa.avg) || (sb.ops - sa.ops);
        });
        newLineup = pool.slice(0, 9).map(p => p.id);
      } else {
        newLineup = generateSmartLineup(team);
      }

      if (newLineup.length === 0) {
        showToast('該球隊尚無球員可供排定打序');
        return;
      }
      if (side === 'away') {
        g.awayLineup = newLineup;
        g.awayOrderIdx = 0;
        if (g.isTop) g.currentBatterId = newLineup[0];
      } else {
        g.homeLineup = newLineup;
        g.homeOrderIdx = 0;
        if (!g.isTop) g.currentBatterId = newLineup[0];
      }
      const modeText = mode === 'avg' ? '依打擊率 (AVG) 高至低' : '依棒次角色智慧';
      saveDB(`已為「${team.name}」${modeText}排定 1～${newLineup.length} 棒打序！`);
      renderWorkspace();
    }

    function updateLineupSlotPlayer(gameId, side, slotIdx, playerId) {
      const g = db.games.find(x => x.id === gameId);
      if (!g) return;
      const lineupKey = side === 'away' ? 'awayLineup' : 'homeLineup';
      const orderIdxKey = side === 'away' ? 'awayOrderIdx' : 'homeOrderIdx';
      if (!Array.isArray(g[lineupKey])) g[lineupKey] = [];
      g[lineupKey][slotIdx] = playerId;
      g[lineupKey] = g[lineupKey].filter(Boolean);

      const isCurrentlyBattingSide = (g.isTop && side === 'away') || (!g.isTop && side === 'home');
      const curIdx = (g[orderIdxKey] || 0) % Math.max(1, g[lineupKey].length);
      if (isCurrentlyBattingSide && curIdx === slotIdx && playerId) {
        g.currentBatterId = playerId;
      }
      saveDB('已更新先發打序棒次');
      renderWorkspace();
    }

    function moveLineupSlot(gameId, side, slotIdx, delta) {
      const g = db.games.find(x => x.id === gameId);
      if (!g) return;
      const lineupKey = side === 'away' ? 'awayLineup' : 'homeLineup';
      const orderIdxKey = side === 'away' ? 'awayOrderIdx' : 'homeOrderIdx';
      const arr = g[lineupKey] || [];
      const targetIdx = slotIdx + delta;
      if (targetIdx < 0 || targetIdx >= arr.length) return;

      const temp = arr[slotIdx];
      arr[slotIdx] = arr[targetIdx];
      arr[targetIdx] = temp;

      const isCurrentlyBattingSide = (g.isTop && side === 'away') || (!g.isTop && side === 'home');
      if (isCurrentlyBattingSide && arr.length > 0) {
        const curIdx = (g[orderIdxKey] || 0) % arr.length;
        g.currentBatterId = arr[curIdx];
      }
      saveDB('已調整打序順序');
      renderWorkspace();
    }

    function handleManualBatterSelect(gameId, playerId) {
      const g = db.games.find(x => x.id === gameId);
      if (!g) return;
      g.currentBatterId = playerId;
      const lineup = g.isTop ? (g.awayLineup || []) : (g.homeLineup || []);
      const foundSlot = lineup.indexOf(playerId);
      if (foundSlot >= 0) {
        if (g.isTop) g.awayOrderIdx = foundSlot;
        else g.homeOrderIdx = foundSlot;
      }
      saveDB('已切換目前打者');
      renderWorkspace();
    }

    function manualSwitchPitcher(gameId, newPitcherId) {
      const g = db.games.find(x => x.id === gameId);
      if (!g) return;
      const away = getTeamById(g.awayTeamId);
      const home = getTeamById(g.homeTeamId);
      const pitchingTeam = g.isTop ? home : away;

      if (newPitcherId) {
        const targetPlayer = (pitchingTeam.players || []).find(p => p.id === newPitcherId);
        if (!targetPlayer || targetPlayer.pos !== 'P') {
          showToast('⚠️ 投手區僅限守備位置為 P 的投手登板！');
          renderWorkspace();
          return;
        }
      }

      if (!Array.isArray(g.usedPitchers)) g.usedPitchers = [];
      if (!g.pitcherPitches) g.pitcherPitches = {};

      const oldPitcherId = g.currentPitcherId;
      if (oldPitcherId && oldPitcherId !== newPitcherId && !g.usedPitchers.includes(oldPitcherId)) {
        g.usedPitchers.push(oldPitcherId);
      }
      g.currentPitcherId = newPitcherId;
      if (newPitcherId && g.pitcherPitches[newPitcherId] === undefined) {
        g.pitcherPitches[newPitcherId] = 0;
      }
      g.lastAutoSubInfo = null;
      saveDB('已更換投球投手');
      renderWorkspace();
    }

    function updateGamePitchLimit(gameId, val) {
      const g = db.games.find(x => x.id === gameId);
      if (!g) return;
      g.pitchLimit = Math.max(1, parseInt(val, 10) || 85);
      saveDB(`本場用球數上限已設為 ${g.pitchLimit} 球`);
      checkAndTriggerAutoPitchingSub(g);
      renderWorkspace();
    }

    function toggleGameAutoSub(gameId, enabled) {
      const g = db.games.find(x => x.id === gameId);
      if (!g) return;
      g.autoSubPitcher = enabled;
      saveDB(enabled ? '已開啟本場自動換投' : '已關閉本場自動換投');
      if (enabled) checkAndTriggerAutoPitchingSub(g);
      renderWorkspace();
    }

    function adjustCurrentPitcherPitches(gameId, delta) {
      const g = db.games.find(x => x.id === gameId);
      if (!g || !g.currentPitcherId) {
        showToast('請先選擇目前投手');
        return;
      }
      if (!g.pitcherPitches) g.pitcherPitches = {};
      const cur = Number(g.pitcherPitches[g.currentPitcherId]) || 0;
      g.pitcherPitches[g.currentPitcherId] = Math.max(0, cur + delta);
      if (delta > 0) {
        checkAndTriggerAutoPitchingSub(g);
      }
      saveDB();
      renderWorkspace();
    }

    function estimatePitchesForOutcome(code) {
      const randInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
      switch (code) {
        case 'SO': return randInt(4, 5);
        case 'BB': return randInt(5, 6);
        case 'IBB': return randInt(0, 4);
        case 'HBP': return randInt(1, 3);
        case '1B':
        case '2B':
        case '3B':
        case 'HR':
        case 'GO':
        case 'FO':
        case 'ROE':
        case 'DP':
        case 'SF':
        case 'SH':
          return randInt(2, 4);
        default:
          return 0;
      }
    }

    function checkAndTriggerAutoPitchingSub(g) {
      if (!g || !g.currentPitcherId) return false;
      const limit = Number(g.pitchLimit) || Number(db.league.defaultPitchLimit) || 85;
      if (!g.autoSubPitcher) return false;

      if (!g.pitcherPitches) g.pitcherPitches = {};
      if (!Array.isArray(g.usedPitchers)) g.usedPitchers = [];

      const curPitcherId = g.currentPitcherId;
      const curPitches = Number(g.pitcherPitches[curPitcherId]) || 0;
      if (curPitches < limit) return false;

      const away = getTeamById(g.awayTeamId);
      const home = getTeamById(g.homeTeamId);
      const pitchingTeam = g.isTop ? home : away;
      const roster = pitchingTeam.players || [];

      const outPitcher = roster.find(p => p.id === curPitcherId);
      if (!outPitcher) return false;

      // 嚴格限定僅從守備位置為 'P' 且尚未登板的牛棚投手中挑選接替
      const unusedPitchersOnly = roster.filter(
        p => p.pos === 'P' && p.id !== curPitcherId && !g.usedPitchers.includes(p.id)
      );
      const nextPitcher = unusedPitchersOnly[0];

      if (!nextPitcher) {
        showToast('⚠️ 牛棚已無可用投手（僅限守備位置 P 登板），請新增投手或調高用球上限');
        return false;
      }

      if (!g.usedPitchers.includes(curPitcherId)) {
        g.usedPitchers.push(curPitcherId);
      }
      g.currentPitcherId = nextPitcher.id;
      if (g.pitcherPitches[nextPitcher.id] === undefined) {
        g.pitcherPitches[nextPitcher.id] = 0;
      }

      const outLabel = formatPlayerWithNumber(outPitcher, 'short');
      const inLabel = formatPlayerWithNumber(nextPitcher, 'short');
      const inningLabel = `${g.inning}${g.isTop ? '上' : '下'}`;
      const subText = `[換投] ${outLabel} 用球數達上限 (${curPitches}球)，系統自動更換 ${inLabel} (P) 登板投球！`;
      const eventId = 'ev_sub_' + Date.now();

      g.events.unshift({
        id: eventId,
        inning: inningLabel,
        batterId: '',
        batterTeamId: '',
        pitcherId: nextPitcher.id,
        pitcherTeamId: pitchingTeam.id,
        code: 'SUB',
        label: '自動換投',
        rbi: 0,
        runs: 0,
        er: 0,
        outsAdded: 0,
        batterScored: false,
        text: subText
      });

      g.lastAutoSubInfo = {
        fromPitcherId: curPitcherId,
        toPitcherId: nextPitcher.id,
        eventId,
        message: `${outLabel} 達上限 (${curPitches}球) → 自動換上 ${inLabel} (P)`
      };

      showToast(`⚾ 自動換投：${inLabel} (P) 接替登板！`);
      return true;
    }

    function undoLastAutoSub(gameId) {
      const g = db.games.find(x => x.id === gameId);
      if (!g || !g.lastAutoSubInfo) return;
      const { fromPitcherId, eventId } = g.lastAutoSubInfo;
      g.currentPitcherId = fromPitcherId;
      g.usedPitchers = (g.usedPitchers || []).filter(id => id !== fromPitcherId);
      g.events = (g.events || []).filter(ev => ev.id !== eventId);
      g.lastAutoSubInfo = null;
      saveDB('已復原自動換投');
      renderWorkspace();
    }

    function appendExtraInning(gameId) {
      const g = db.games.find(x => x.id === gameId);
      if (!g) return;
      g.inningsAway.push(null);
      g.inningsHome.push(null);
      saveDB(`已新增第 ${g.inningsAway.length} 局`);
      renderWorkspace();
    }

    function stepInning(gameId, delta) {
      const g = db.games.find(x => x.id === gameId);
      if (!g) return;
      g.inning = Math.max(1, Math.min(15, g.inning + delta));
      while (g.inningsAway.length < g.inning) {
        g.inningsAway.push(null);
        g.inningsHome.push(null);
      }
      saveDB(`切換至第 ${g.inning} 局`);
      renderWorkspace();
    }

    function flipHalfInning(gameId) {
      const g = db.games.find(x => x.id === gameId);
      if (!g) return;
      g.isTop = !g.isTop;
      saveDB(`切換至 ${g.inning}局${g.isTop ? '上' : '下'}`);
      renderWorkspace();
    }

    function toggleGameBase(gameId, idx) {
      const g = db.games.find(x => x.id === gameId);
      if (!g) return;
      g.bases[idx] = !g.bases[idx];
      saveDB();
      renderWorkspace();
    }

    function cycleGameBSO(gameId, key) {
      const g = db.games.find(x => x.id === gameId);
      if (!g) return;
      const limits = { balls: 3, strikes: 2, outs: 2 };
      g[key] = (g[key] + 1) > limits[key] ? 0 : g[key] + 1;
      saveDB();
      renderWorkspace();
    }

    function setInningRun(gameId, side, idx, val) {
      const g = db.games.find(x => x.id === gameId);
      if (!g) return;
      const parsed = val === '' ? null : Math.max(0, parseInt(val, 10) || 0);
      if (side === 'away') g.inningsAway[idx] = parsed;
      else g.inningsHome[idx] = parsed;
      saveDB('已更新單局分數');
      renderWorkspace();
    }

    function deleteGameEvent(gameId, eventId) {
      const g = db.games.find(x => x.id === gameId);
      if (!g) return;
      g.events = (g.events || []).filter(ev => ev.id !== eventId);
      saveDB('已刪除該筆打席紀錄');
      renderWorkspace();
    }

    function recordPlateAppearance(gameId, code, label) {
      const g = db.games.find(x => x.id === gameId);
      if (!g) return;

      const away = getTeamById(g.awayTeamId);
      const home = getTeamById(g.homeTeamId);
      const battingTeam = g.isTop ? away : home;
      const pitchingTeam = g.isTop ? home : away;

      ensureGameLineupsAndPitcher(g);

      const batter = (battingTeam.players || []).find(p => p.id === g.currentBatterId);
      const pitcher = (pitchingTeam.players || []).filter(p => p.pos === 'P').find(p => p.id === g.currentPitcherId);

      if (pitcher) {
        if (!g.pitcherPitches) g.pitcherPitches = {};
        const addedPitches = estimatePitchesForOutcome(code);
        g.pitcherPitches[pitcher.id] = (Number(g.pitcherPitches[pitcher.id]) || 0) + addedPitches;
      }

      const batterName = batter ? formatPlayerName(batter, 'short') : `${battingTeam.name}打者`;
      const pitcherName = pitcher ? formatPlayerName(pitcher, 'short') : `${pitchingTeam.name}投手`;

      const autoSim = document.getElementById('chk-auto-sim')?.checked;
      const extraRbi = Math.max(0, parseInt(document.getElementById('extra-rbi-input')?.value || '0', 10));
      const extraEr = Math.max(0, parseInt(document.getElementById('extra-er-input')?.value || '0', 10));
      const customNote = document.getElementById('custom-note-input')?.value.trim();

      const idx = g.inning - 1;
      while (g.inningsAway.length <= idx) {
        g.inningsAway.push(null);
        g.inningsHome.push(null);
      }

      let runsScored = 0;
      let outsAdded = 0;

      if (autoSim) {
        if (['1B', '2B', '3B', 'HR'].includes(code)) {
          if (g.isTop) g.awayHits++; else g.homeHits++;
        }
        if (code === 'ROE') {
          if (g.isTop) g.homeErrors++; else g.awayErrors++;
        }

        if (code === '1B' || code === 'ROE') {
          if (g.bases[2]) { runsScored++; g.bases[2] = false; }
          if (g.bases[1]) { g.bases[2] = true; g.bases[1] = false; }
          if (g.bases[0]) { g.bases[1] = true; }
          g.bases[0] = true;
          g.balls = 0; g.strikes = 0;
        } else if (code === '2B') {
          if (g.bases[2]) { runsScored++; g.bases[2] = false; }
          if (g.bases[1]) { runsScored++; g.bases[1] = false; }
          if (g.bases[0]) { g.bases[2] = true; g.bases[0] = false; }
          g.bases[1] = true;
          g.balls = 0; g.strikes = 0;
        } else if (code === '3B') {
          runsScored += (g.bases[0]?1:0) + (g.bases[1]?1:0) + (g.bases[2]?1:0);
          g.bases = [false, false, true];
          g.balls = 0; g.strikes = 0;
        } else if (code === 'HR') {
          runsScored += (g.bases[0]?1:0) + (g.bases[1]?1:0) + (g.bases[2]?1:0) + 1;
          g.bases = [false, false, false];
          g.balls = 0; g.strikes = 0;
        } else if (code === 'BB' || code === 'HBP') {
          if (g.bases[0] && g.bases[1] && g.bases[2]) runsScored = 1;
          else if (g.bases[0] && g.bases[1]) g.bases[2] = true;
          else if (g.bases[0]) g.bases[1] = true;
          else g.bases[0] = true;
          g.balls = 0; g.strikes = 0;
        } else if (['SO', 'GO', 'FO', 'SH'].includes(code)) {
          outsAdded = 1;
          g.outs += 1;
          g.balls = 0; g.strikes = 0;
        } else if (code === 'SF') {
          outsAdded = 1;
          g.outs += 1;
          if (g.bases[2]) { runsScored++; g.bases[2] = false; }
          g.balls = 0; g.strikes = 0;
        } else if (code === 'DP') {
          outsAdded = 2;
          g.outs += 2;
          g.bases[0] = false;
          g.balls = 0; g.strikes = 0;
        } else if (code === 'SB') {
          if (g.bases[1] && !g.bases[2]) { g.bases[2] = true; g.bases[1] = false; }
          else if (g.bases[0] && !g.bases[1]) { g.bases[1] = true; g.bases[0] = false; }
        }
      }

      const finalRuns = Math.max(runsScored, extraRbi);
      const finalRbi = ['ROE', 'SB'].includes(code) ? extraRbi : Math.max(runsScored, extraRbi);
      const finalEr = code === 'ROE' ? extraEr : Math.max(finalRuns, extraEr);

      if (finalRuns > 0) {
        if (g.isTop) g.inningsAway[idx] = (g.inningsAway[idx] || 0) + finalRuns;
        else g.inningsHome[idx] = (g.inningsHome[idx] || 0) + finalRuns;
      }

      const inningLabel = `${g.inning}${g.isTop ? '上' : '下'}`;
      let desc = customNote || `${batterName} 對決 ${pitcherName}：${label}`;
      if (finalRuns > 0 && !customNote) desc += ` (攻下 ${finalRuns} 分)`;

      if (autoSim && g.outs >= 3) {
        g.outs = 0;
        g.bases = [false, false, false];
        if (g.isTop) {
          g.isTop = false;
        } else {
          g.isTop = true;
          g.inning += 1;
        }
        desc += ` — 三出局換邊 (${g.inning}局${g.isTop ? '上' : '下'})`;
      }

      g.events.unshift({
        id: 'ev_' + Date.now(),
        inning: inningLabel,
        batterId: batter ? batter.id : '',
        batterTeamId: battingTeam.id,
        pitcherId: pitcher ? pitcher.id : '',
        pitcherTeamId: pitchingTeam.id,
        code,
        label,
        rbi: finalRbi,
        runs: finalRuns,
        er: finalEr,
        outsAdded,
        batterScored: code === 'HR',
        text: desc
      });

      // 依 1~9 棒打序輪轉推進下一棒
      if (code !== 'SB') {
        const activeLineup = g.isTop ? (g.awayLineup || []) : (g.homeLineup || []);
        if (activeLineup.length > 0) {
          const curOrderIdx = g.isTop ? (g.awayOrderIdx || 0) : (g.homeOrderIdx || 0);
          const nextOrderIdx = (curOrderIdx + 1) % activeLineup.length;
          if (g.isTop) g.awayOrderIdx = nextOrderIdx;
          else g.homeOrderIdx = nextOrderIdx;

          const newBattingLineup = g.isTop ? (g.awayLineup || []) : (g.homeLineup || []);
          const newOrderIdx = g.isTop ? (g.awayOrderIdx || 0) : (g.homeOrderIdx || 0);
          if (newBattingLineup.length > 0) {
            g.currentBatterId = newBattingLineup[newOrderIdx % newBattingLineup.length];
          }
        }
      }

      const didAutoSub = checkAndTriggerAutoPitchingSub(g);
      if (!didAutoSub) {
        saveDB(`已記錄 ${label}，打擊率與數據已自動更新！`);
      } else {
        saveDB();
      }
      renderWorkspace();
    }

    function openGameModal(gameId = null) {

      openModal(g ? '編輯賽程資訊' : '新增比賽賽程', `

              <input type="text" id="gm-venue" value="${g ? g.venue : '主球場'}" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-2.5 py-2 text-xs text-white">
            </div>

          <div class="flex justify-end gap-2 pt-2">

            <button type="submit" class="px-5 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs font-black">儲存賽程</button>
          </div>

      `);

      if (g) {
        document.getElementById('gm-away').value = g.awayTeamId;
        document.getElementById('gm-home').value = g.homeTeamId;
      } else {
        document.getElementById('gm-away').value = db.teams[0].id;
        document.getElementById('gm-home').value = db.teams[1].id;
      }
    }

    function saveGameForm(e, gameId) {
      e.preventDefault();
      const awayId = document.getElementById('gm-away').value;
      const homeId = document.getElementById('gm-home').value;
      if (awayId === homeId) {
        showToast('主隊與客隊不能選擇同一支球隊');
        return;
      }

      const payload = {
        title: document.getElementById('gm-title').value.trim(),
        status: document.getElementById('gm-status').value,
        awayTeamId: awayId,
        homeTeamId: homeId,
        date: document.getElementById('gm-date').value,
        time: document.getElementById('gm-time').value,
        venue: document.getElementById('gm-venue').value.trim()
      };

      if (gameId) {
        const g = db.games.find(x => x.id === gameId);
        if (g) {
          Object.assign(g, payload);
          ensureGameLineupsAndPitcher(g);
        }
        saveDB('賽程已更新');
      } else {
        const regInnings = Number(db.league.inningsPerGame) || 9;
        const awayTeam = getTeamById(awayId);
        const homeTeam = getTeamById(homeId);
        const awayLineup = generateSmartLineup(awayTeam);
        const homeLineup = generateSmartLineup(homeTeam);
        const startPitcher = (homeTeam.players || []).find(p => p.pos === 'P');

        const newGame = {
          id: 'game_' + Date.now(),
          ...payload,
          inning: 1,
          isTop: true,
          balls: 0,
          strikes: 0,
          outs: 0,
          bases: [false, false, false],
          awayLineup,
          homeLineup,
          awayOrderIdx: 0,
          homeOrderIdx: 0,
          currentBatterId: awayLineup[0] || '',
          currentPitcherId: startPitcher ? startPitcher.id : '',
          pitchLimit: Number(db.league.defaultPitchLimit) || 85,

          usedPitchers: [],
          lastAutoSubInfo: null,
          inningsAway: Array(regInnings).fill(null),
          inningsHome: Array(regInnings).fill(null),
          awayHits: 0,
          homeHits: 0,
          awayErrors: 0,
          homeErrors: 0,
          winPitcherId: '',
          losePitcherId: '',
          savePitcherId: '',
          events: []
        };
        db.games.unshift(newGame);
        ui.selectedGameId = newGame.id;
        saveDB('已建立新比賽並自動排好先發打序！');
